<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Shelf Pulse — Cairo 3A</title>
<style>
  :root{
    --red:#C0272D; --red-dark:#8E1116; --red-tint:#FBEAEA;
    --ink:#201B1A; --ink-soft:#6B615E;
    --bg:#F6F2EF; --card:#FFFFFF; --line:#E9E1DD;
    --green:#1E7145; --green-tint:#E7F3EC;
    --amber:#9C6B08; --amber-tint:#FBF1DD;
    --danger-tint:#FBEAEA;
    --radius:14px;
    --shadow:0 1px 2px rgba(32,27,26,.06), 0 6px 20px -8px rgba(32,27,26,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:78px;}
  .app{max-width:520px;margin:0 auto;position:relative;overflow-x:hidden;}
  .topbar{background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 100%);color:#fff;padding:16px 18px 20px;border-radius:0 0 20px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .topbar::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08);}
  .topbar-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:-.5px;}
  .brand-name{font-size:16px;font-weight:700;letter-spacing:.2px;}
  .brand-sub{font-size:11px;opacity:.85;margin-top:1px;}
  .role-pill{display:flex;background:rgba(255,255,255,.16);border-radius:20px;padding:3px;gap:2px;}
  .role-pill button{border:none;background:transparent;color:#fff;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:16px;opacity:.7;cursor:pointer;}
  .role-pill button.active{background:#fff;color:var(--red-dark);opacity:1;}
  .who-row{margin-top:14px;position:relative;z-index:1;}
  .who-input{width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:9px 12px;font-size:13px;}
  .who-input::placeholder{color:rgba(255,255,255,.75);}
  .screen{padding:16px 16px 8px;}
  .screen h1{font-size:18px;margin:2px 0 3px;letter-spacing:-.2px;}
  .screen .lede{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
  .card h3{font-size:13px;margin:0 0 10px;color:var(--ink);font-weight:700;}
  label{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.3px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1.5px solid var(--line);background:#FDFCFB;border-radius:9px;padding:10px 11px;font-size:14.5px;color:var(--ink);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .hint{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:active{background:var(--red-dark);}
  .btn-ghost{background:transparent;color:var(--red);border:1.5px solid var(--red);}
  .btn-line{background:var(--card);color:var(--ink);border:1.5px dashed var(--line);}
  .btn-sm{padding:8px 12px;font-size:12.5px;width:auto;border-radius:9px;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-danger{background:var(--red);color:#fff;}
  .sku-line{border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .sku-line-head{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:#FBF9F8;cursor:pointer;}
  .sku-line-title{font-size:13.5px;font-weight:700;}
  .sku-line-meta{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .sku-line-body{padding:12px;border-top:1px solid var(--line);}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .chip.on{background:var(--green-tint);color:var(--green);}
  .chip.watch{background:var(--amber-tint);color:var(--amber);}
  .chip.off{background:var(--danger-tint);color:var(--red);}
  .chip.neutral{background:#EFEBE9;color:var(--ink-soft);}
  .remove-x{background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:2px 6px;}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);}
  .kpi .num{font-size:22px;font-weight:800;letter-spacing:-.5px;}
  .kpi .lbl{font-size:10.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:2px;}
  .kpi.accent .num{color:var(--red);}
  .gauge-wrap{display:flex;align-items:center;gap:14px;}
  .gauge-num{font-size:24px;font-weight:800;}
  .gauge-lbl{font-size:11px;color:var(--ink-soft);}
  .visit-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
  .visit-row:last-child{border-bottom:none;}
  .visit-main{font-size:13.5px;font-weight:700;}
  .visit-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .status-badge{font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
  .status-pending{background:var(--amber-tint);color:var(--amber);}
  .status-approved{background:var(--green-tint);color:var(--green);}
  .status-rejected{background:var(--danger-tint);color:var(--red);}
  table.mini{width:100%;border-collapse:collapse;font-size:12px;}
  table.mini th{text-align:left;font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;padding:6px 6px;border-bottom:1.5px solid var(--line);}
  table.mini td{padding:8px 6px;border-bottom:1px solid var(--line);}
  table.mini tr:last-child td{border-bottom:none;}
  .bar-track{background:#EFEBE9;border-radius:6px;height:7px;width:100%;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .empty{text-align:center;padding:34px 16px;color:var(--ink-soft);}
  .empty .big{font-size:30px;margin-bottom:8px;}
  .empty p{font-size:12.5px;margin:2px 0;}
  .navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -4px 16px rgba(0,0,0,.06);z-index:20;}
  .navbtn{flex:1;border:none;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);cursor:pointer;}
  .navbtn.active{color:var(--red);}
  .navbtn .ico{font-size:18px;line-height:1;}
  .navbtn .lbl{font-size:9.5px;font-weight:700;}
  .badge-dot{position:absolute;top:2px;right:18%;background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .navbtn-wrap{position:relative;flex:1;display:flex;}
  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;max-width:88%;text-align:center;}
  .cam-overlay{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;}
  .cam-video-wrap{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000;}
  .cam-video-wrap video, .cam-video-wrap img{width:100%;height:100%;object-fit:cover;}
  .cam-controls{padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:28px;background:#000;}
  .cam-shutter{width:70px;height:70px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.4);cursor:pointer;}
  .cam-shutter:active{background:#ddd;}
  .cam-side-btn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:24px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;}
  .cam-top-bar{position:absolute;top:0;left:0;right:0;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;z-index:2;}
  .cam-close-btn{background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;}
  .cam-hint{color:#fff;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:16px;font-size:12px;}
  .loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}
  .sectitle{font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px 2px;}
  .sectitle:first-child{margin-top:0;}
  .pillrow{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
  .pillrow button{flex-shrink:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer;}
  .pillrow button.active{background:var(--red);border-color:var(--red);color:#fff;}
  .search-result{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .search-result:last-child{border-bottom:none;}
  .search-result:active{background:#FBF9F8;}
  .sr-main{font-size:13px;font-weight:700;}
  .sr-sub{font-size:11px;color:var(--ink-soft);}
  .photo-box{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;}
  .photo-preview{width:100%;border-radius:10px;margin-bottom:8px;max-height:180px;object-fit:cover;}
  .verify-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .branch-toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;border-top:1px solid var(--line);}
  .branch-toggle:first-child{border-top:none;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div id="setup-screen" style="display:none;max-width:520px;margin:40px auto;padding:0 18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#201B1A;">
  <div style="background:#C0272D;color:#fff;padding:20px;border-radius:16px;margin-bottom:16px;">
    <div style="font-weight:800;font-size:18px;">⚙️ One-time setup needed</div>
    <div style="font-size:13px;opacity:.9;margin-top:4px;">Paste your Firebase config below to connect the database.</div>
  </div>
  <div style="background:#fff;border:1px solid #E9E1DD;border-radius:14px;padding:16px;font-size:13.5px;line-height:1.6;">
    <p>Edit the <code>firebaseConfig</code> object near the top of this HTML file with your Firebase project's web config.</p>
  </div>
</div>

<!-- Leaflet mapping library, bundled inline for reliability -->
<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: url(images/layers.png);
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: url(images/layers-2x.png);
	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {

/* ============================= DATA CORRECTION TOOLS (decimal-error detection + fixing) ============================= */
const MAX_PLAUSIBLE_PRICE = 600; // business rule: no Shahd pack costs anywhere near this — anything above is a data-entry error
function findSuspiciousPrices(){
  const candidates = [];
  State.visits.forEach(v=>{
    (v.items||[]).forEach(it=>{
      const sku = SKU_MAP[it.skuId]; if(!sku) return;
      const price = parseFloat(it.actualPrice);
      if(!price || price <= MAX_PLAUSIBLE_PRICE) return; // only chase clearly-impossible prices
      const corrected = price/100;
      const confident = sku.rsp>0 && Math.abs(corrected-sku.rsp)/sku.rsp <= 0.4 && corrected <= MAX_PLAUSIBLE_PRICE;
      candidates.push({ visitId:v.id, skuId:it.skuId, skuName:sku.name, account:v.accountName, branch:v.branch, date:v.date, original:price, corrected: confident ? +corrected.toFixed(2) : null, rsp:sku.rsp||0, confident });
    });
  });
  return candidates.sort((a,b)=>b.original-a.original);
}
function findSuspiciousCapacity(){
  const candidates = [];
  State.visits.forEach(v=>{
    (v.items||[]).forEach(it=>{
      const sku = SKU_MAP[it.skuId]; if(!sku) return;
      const capacity = parseFloat(it.actualCapacity);
      const closing = parseFloat(it.closing);
      const shahdSpace = parseFloat(it.shahdSpaceTotal);
      if(isNaN(capacity) || isNaN(closing)) return;
      if(capacity <= closing) return; // fine — facings filled can't exceed units actually on the shelf
      // Likely cause: the merchandiser typed the total dedicated Shahd space into this SKU's own field by
      // mistake, rather than what was actually filled for just this SKU — worth flagging separately since
      // the fix here isn't just "cap to closing".
      const looksLikeFieldMixup = !isNaN(shahdSpace) && shahdSpace>0 && Math.abs(capacity-shahdSpace) < 0.01;
      candidates.push({ visitId:v.id, skuId:it.skuId, skuName:sku.name, account:v.accountName, branch:v.branch, date:v.date, capacity, closing, pog:shahdSpace, looksLikeFieldMixup });
    });
  });
  return candidates.sort((a,b)=>(b.capacity-b.closing)-(a.capacity-a.closing));
}
// SUC/SOS monitor — unlike the counting-error checks above (which catch an impossible relationship
// between two fields on the SAME visit), these catch a visit whose own SUC or SOS reading, taken at
// face value, is past what's realistically plausible — dedicated space more than fully filled, or a
// share of category shelf well above the known ~20% average. Same "review, don't auto-fix" reasoning
// as the fast-visit flag: there's no single correct value to fall back to.
// Scoped to each branch's LATEST visit only, using the same code-based branch identity as
// computeCustomerAnalysis/computeOpportunities — an old visit's bad reading is superseded the moment
// a newer visit exists for that same physical branch (even under a different duplicate account), so
// there's nothing to flag or clean up about it once it's no longer the one "in effect".
const SUC_MONITOR_MAX = 100; // business rule: can't legitimately fill more than 100% of dedicated Shahd space
const SOS_MONITOR_MAX = 20; // business rule: known network average is ~20% — anything past that is inflated
function findLatestVisitPerBranch(visits){
  const accountsById = {};
  State.accounts.forEach(a=>{ accountsById[a.id] = a; });
  const latestByBranch = {};
  const sorted = [...(visits || State.visits)].filter(v=>v.status!=='rejected').sort((a,b)=>(a.submittedAt||0)-(b.submittedAt||0));
  sorted.forEach(v=>{
    const custName = canonicalCustomerName(v.accountName);
    const acct = accountsById[v.accountId];
    const branchKey = (acct && acct.customerId) ? acct.customerId : (v.branch||'').trim().toLowerCase();
    latestByBranch[custName+'||'+branchKey] = v; // overwritten each pass — ends on the latest visit for this branch
  });
  return Object.values(latestByBranch);
}
function findInflatedSucVisits(){
  const candidates = [];
  findLatestVisitPerBranch().forEach(v=>{
    try{
      const agg = visitAggregate(v);
      if(agg.avgSfr > SUC_MONITOR_MAX){
        candidates.push({ visitId:v.id, account:v.accountName, branch:v.branch, date:v.date, auditor:v.auditor, status:v.status, value:agg.avgSfr });
      }
    }catch(e){ console.error('Skipping malformed visit in SUC monitor:', v && v.id, e); }
  });
  return candidates.sort((a,b)=>b.value-a.value);
}
function findInflatedSosVisits(){
  const candidates = [];
  findLatestVisitPerBranch().forEach(v=>{
    try{
      const agg = visitAggregate(v);
      if(agg.avgSos > SOS_MONITOR_MAX){
        candidates.push({ visitId:v.id, account:v.accountName, branch:v.branch, date:v.date, auditor:v.auditor, status:v.status, value:agg.avgSos });
      }
    }catch(e){ console.error('Skipping malformed visit in SOS monitor:', v && v.id, e); }
  });
  return candidates.sort((a,b)=>b.value-a.value);
}
async function deleteOneVisit(visitId){
  const v = State.visits.find(x=>x.id===visitId);
  if(!v){ showToast('Visit not found'); return; }
  await deleteVisitList([v], `this one visit (${v.accountName} · ${v.branch} · ${v.date})`);
}
// Review-only flag — unlike price/capacity there's no "correct value" to auto-fix to, since duration
// is derived from timestamps, not a typed field. Surfaced inline on a visit during approval review
// (see the "too fast to be real" chip) rather than as a standing list — arrivedAt-based detection in
// the Arrivals tab already flags this live, and a persistent list here just accumulated old visits
// that a new one at the same branch never cleared.
const SHORT_VISIT_MINUTES = 2; // business rule: can't realistically photograph, count facings, and check prices in under this
async function applyCapacityFix(c){
  const visit = State.visits.find(v=>v.id===c.visitId); if(!visit) return;
  const newItems = (visit.items||[]).map(it => it.skuId===c.skuId ? {...it, actualCapacity: String(c.closing)} : it);
  await visitUpdate(c.visitId, { items: newItems });
}
async function applyAllCapacityFixes(){
  const candidates = findSuspiciousCapacity();
  if(candidates.length===0){ showToast('No capacity issues found'); return; }
  if(!confirm(`Reduce actual capacity down to match closing stock for ${candidates.length} record(s)? This can't be undone.`)) return;
  showToast('Applying fixes…');
  for(const c of candidates){ try{ await applyCapacityFix(c); }catch(e){ console.error(e); } }
  showToast('Fixes applied ✓');
  render();
}
async function applyOneCapacityFix(idx){
  const candidates = findSuspiciousCapacity();
  const c = candidates[idx]; if(!c) return;
  await applyCapacityFix(c);
  showToast('Fixed ✓');
  render();
}
async function applyPriceFix(c){
  const visit = State.visits.find(v=>v.id===c.visitId); if(!visit) return;
  const newItems = (visit.items||[]).map(it => it.skuId===c.skuId ? {...it, actualPrice: String(c.corrected)} : it);

async function applyAllPriceFixes(){
  const candidates = findSuspiciousPrices().filter(c=>c.confident);
  if(candidates.length===0){ showToast('No confidently-correctable prices found — remaining ones need manual review'); return; }
  if(!confirm(`Apply the ÷100 decimal fix to ${candidates.length} price(s) we're confident about? Any others need manual review via the visit editor.`)) return;
  showToast('Applying fixes…');
  for(const c of candidates){ try{ await applyPriceFix(c); }catch(e){ console.error(e); } }
  showToast('Fixes applied ✓');
  render();
}
async function applyOnePriceFix(idx){
  const candidates = findSuspiciousPrices();
  const c = candidates[idx]; if(!c || !c.confident) return;
  await applyPriceFix(c);

}

function openVisitEditor(id){

  // editing any other line's copy silently did nothing, which is exactly what looked like "can't be

async function deleteVisitList(targets, label){
  if(State.role!=='trade_marketing'){ showToast('Not authorized'); return; }
  const count = targets.length;
  if(count===0){ showToast('Nothing to delete'); return; }
  if(!confirm(`This will permanently delete ${label}. This cannot be undone. Continue?`)) return;
  const { doc, deleteDoc } = firestoreFns;
  showToast('Deleting…');
  const ids = new Set(targets.map(v=>v.id));
  for(const v of targets){
    try{ await deleteDoc(doc(db, 'visits', v.id)); }catch(e){ console.error(e); }
  }
  // Best-effort cleanup: an arrival still pointing at a deleted visit would otherwise keep showing
  // as "completed" on the Arrivals tab for a visit that no longer exists.
  const orphanArrivals = State.arrivals.filter(a=>a.visitId && ids.has(a.visitId));
  for(const a of orphanArrivals){
    try{ await deleteDoc(doc(db, 'arrivals', a.id)); }catch(e){ console.error(e); }
  }
  showToast(`Deleted ✓ (${count})`);
}

    avgSfr = counted.length ? counted.reduce((s,it)=>s+it.calc.sfr,0) / counted.length : 0; // old semantics: an average across independently-targeted SKUs, not shares of a whole
  }
  // sosVsShahd needs every item's shahdFacings at once (this SKU's share of the visit's total Shahd
  // facings, distinct from `sos` which is share of the whole category) — computeItem only sees one
  // item at a time, so this is layered on afterward, here, once per visit. Marinated Fresh facings are
  // excluded from the total itself (not just given a 0 share), since they're a different category.
  const shahdCounted = items.filter(it=>!it.calc.excludedFromSucSos);
  const totalShahdFacings = shahdCounted.reduce((s,it)=>s+(parseFloat(it.shahdFacings)||0),0);
  items.forEach(it => { it.calc.sosVsShahd = it.calc.excludedFromSucSos ? null : (totalShahdFacings>0 ? Math.min(100, (parseFloat(it.shahdFacings)||0)/totalShahdFacings*100) : 0); });
  const n = items.length || 1;
  const avg = f => items.reduce((s,it)=>s+f(it.calc),0) / n;
  const finiteCoverage = items.map(it=>it.calc.stockCoverage).filter(x=>isFinite(x));
  const legacyTotal = hasNewTotal ? null : rawItems.reduce((s,it)=>s+(parseFloat(it.pogFacings)||0),0);
  return {
    items,
    avgSfr,
    // A SUM, same reasoning as avgSfr above — sos per item is this SKU's share of total category
    // facings, so summing gives the true overall SOS instead of dividing it by however many SKUs exist.
    // Marinated Fresh's sos:null coerces to 0 and doesn't affect this sum — excluded, as intended.
    avgSos: items.reduce((s,it)=>s+(it.calc.sos||0),0),
    osaPct: items.filter(it=>it.calc.osa==='Y').length / n * 100,
    priceOkPct: items.filter(it=>it.calc.priceStatus==='on').length / n * 100,
    visitDonePct: items.filter(it=>it.calc.visitDone).length / n * 100,
    totalUnits: items.reduce((s,it)=>s+it.calc.unitsSold,0),
    avgVelocity: avg(c=>c.velocity),
    avgCoverage: finiteCoverage.length ? finiteCoverage.reduce((a,b)=>a+b,0)/finiteCoverage.length : 0,
    hasPhoto: !!(visit.photos && visit.photos.length) || !!visit.photo,
    hasGeo: !!visit.geo,
    // Absolute totals for this visit — one number each, not per-SKU (category facings and dedicated
    // Shahd space are visit-level inputs; Shahd facings is the sum across every SKU). For legacy
    // visits this total is informational only now (a rough sum of old per-SKU targets for display) —
    // it's no longer used in the SUC% math above, which is why the two can look inconsistent on an
    // old visit; that inconsistency is expected and resolves itself once re-submitted under the new model.
    catFacingsTotal: parseFloat(rawItems[0]?.catFacings) || 0,
    shahdSpaceTotal: hasNewTotal ? (parseFloat(rawItems[0]?.shahdSpaceTotal) || 0) : legacyTotal,
    shahdFacingsTotal: totalShahdFacings,
  };
}

function scoreFor(a){
  const clamp = x => Math.max(0, Math.min(100, x||0));
  return clamp(a.avgSfr)*0.25 + clamp(a.osaPct)*0.15 + clamp(a.priceOkPct)*0.20 + clamp(a.avgSos)*0.15 + clamp(a.visitAchievedPct)*0.15 + clamp(a.visitDonePct)*0.10;
}

/* ============================= DATA LOAD/SAVE ============================= */
async function loadAll(){
  if(!isConfigured){ State.loaded = true; return; }
  const me = localStorage.getItem('shelfpulse_me');
  let hasSavedSession = false;
  if(me){ try{ const p = JSON.parse(me); if(ROLES[p.role]){ State.role = p.role; State.name = p.name || ''; State.merchCode = p.merchCode || null; State.navContext = roleConf().contexts[0]; hasSavedSession = true; } }catch(e){} }

  const skusDoc = await refGet('skus');
  if(!skusDoc || skusDoc.version !== REF_DATA_VERSION){
    await refSet('skus', DEFAULT_SKUS, REF_DATA_VERSION);
    State.skus = DEFAULT_SKUS;
  } else {
    State.skus = skusDoc.list;
  }
  SKU_MAP = {}; State.skus.forEach(s=>SKU_MAP[s.id]=s);

  const accDoc = await refGet('accounts');
  if(!accDoc || accDoc.version !== REF_DATA_VERSION){
    await refSet('accounts', DEFAULT_ACCOUNTS, REF_DATA_VERSION);
    State.accounts = DEFAULT_ACCOUNTS;
  } else {
    State.accounts = accDoc.list;
  }
  const dirDoc = await refGet('merchDirectory');
  State.merchDirectory = (dirDoc && dirDoc.list) ? dirDoc.list : {};

  await loadLocations();
  watchVisits();
  watchDelegations();
  watchArrivals();
  watchGalleries();
  setInterval(checkLongOnsiteArrivals, 5*60*1000); // periodic — nothing in Firestore changes while someone's just sitting "active", so this can't be event-driven like the other notifications
  State.loaded = true;
  if(hasSavedSession) restoreDraftIfAny();
}
async function loadLocations(){
  try{
    const { doc, getDoc } = firestoreFns;
    const snap = await getDoc(doc(db, 'meta', 'locations'));
    State.locations = snap.exists() ? (snap.data().byAccount || {}) : {};
  }catch(e){ State.locations = {}; }
}
async function recordLocationLearning(visit){
  if(!visit.geo || !visit.accountId) return;
  try{
    const existing = State.locations[visit.accountId];
    // Keep whichever GPS reading is most precise (lowest accuracy-in-metres number) seen so far for this branch.
    if(existing && existing.accuracy != null && visit.geo.accuracy != null && existing.accuracy <= visit.geo.accuracy) return;
    const { doc, setDoc } = firestoreFns;
    const entry = { lat: visit.geo.lat, lng: visit.geo.lng, accuracy: visit.geo.accuracy||null, branch: visit.branch, accountName: visit.accountName, updatedAt: Date.now() };
    State.locations[visit.accountId] = entry;
    // merge:true writes only this one account's key inside byAccount, so concurrent submissions for other
    // branches (from other merchandisers at the same time) can't overwrite each other.
    await setDoc(doc(db, 'meta', 'locations'), { byAccount: { [visit.accountId]: entry } }, { merge: true });
  }catch(e){ console.error('location learning failed', e); }
}

/* ============================= DRAFT PERSISTENCE (crash/network recovery) ============================= */
function saveDraftLocal(){
  const payload = { role: State.role, name: State.name, savedAt: Date.now(), draft: State.draft };
  try{
    localStorage.setItem('shelfpulse_draft', JSON.stringify(payload));
  }catch(e){
    // Quota exceeded — almost always because base64 photos are large, not because of the typed
    // SKU data. Losing photos on a crash/refresh is recoverable (retake them); losing an hour of
    // typed-in fields is not. So retry without photos instead of silently losing everything.
    try{
      const slim = { ...payload, draft: { ...State.draft, photos: [] } };
      localStorage.setItem('shelfpulse_draft', JSON.stringify(slim));
      if(!State._draftPhotoWarnShown){
        State._draftPhotoWarnShown = true;
        showToast("Your entries are backed up, but photos are too large to back up locally — if the app closes now you'll need to retake them");
      }
    }catch(e2){ /* still failing — device storage is genuinely full; nothing more we can do locally */ }
  }
}
function clearDraftLocal(){ try{ localStorage.removeItem('shelfpulse_draft'); }catch(e){} State._draftPhotoWarnShown = false; }
function restoreDraftIfAny(){
  try{
    const raw = localStorage.getItem('shelfpulse_draft');
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved.role===State.role && saved.name===State.name && saved.draft && saved.draft.items && saved.draft.items.length){
      // A draft that started on an earlier calendar day is stale — visits are always dated today (see
      // the "always today" lock), so resuming yesterday's in-progress arrival/SKU data under today's
      // date would silently misattribute it. Discard it instead and let them start clean — this is
      // the merchandiser-side half of "closing" a stuck arrival; the other half is a management action
      // on the Arrivals tab that closes the matching server-side record for reporting purposes.
      const startedDay = saved.draft.arrivedAt ? new Date(saved.draft.arrivedAt).toISOString().slice(0,10)
                        : (saved.draft.capturedAt ? new Date(saved.draft.capturedAt).toISOString().slice(0,10) : null);
      if(startedDay && startedDay !== todayStr()){
        clearDraftLocal();
        return;
      }
      State.draft = saved.draft;
      showToast('Resumed your unsaved visit draft ✓');
    }
  }catch(e){ /* ignore corrupt draft */ }
}

async function submitVisit(){
  const d = State.draft;
  if(State.submitting) return; // guards against double-tap / double-submit
  if(!d.accountName || !d.branch){ showToast('Select an account first'); return; }
  if(d.items.length === 0){ showToast('No SKUs loaded — reselect the account'); return; }
  if(!d.photos || d.photos.length === 0){
    showToast('Take at least one photo before submitting — it also captures your location');
    return;
  }
  if(!d.geo){
    // One more quiet attempt right before we ask them to accept "unverified" — by the time someone's
    // finished the whole visit and is hitting submit, they've often drifted closer to a door or
    // window since the arrival/first-photo attempt, so GPS has a real shot at a fix now that didn't
    // exist a few minutes ago. Bounded so it can't turn into another hang.
    showToast('Checking location…');
    try{
      d.geo = await withTimeout(new Promise(resolve => {
        if(!navigator.geolocation){ resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat:+pos.coords.latitude.toFixed(5), lng:+pos.coords.longitude.toFixed(5), accuracy:Math.round(pos.coords.accuracy) }),
          () => resolve(null),
          { enableHighAccuracy:true, timeout:8000 }
        );
      }), 10000);
    }catch(e){ d.geo = null; }
    if(d.geo) saveDraftLocal();
  }
  if(!d.geo){
    const proceed = confirm('No location was captured for this visit (weak GPS signal indoors is common) — it will be flagged as unverified. Submit anyway?');
    if(!proceed) return;
  }
  if(d.catFacingsTotal === '' || d.catFacingsTotal === null || isNaN(parseFloat(d.catFacingsTotal))){
    showToast('Enter the total category facings (all brands) before submitting');
    return;
  }
  if(d.shahdSpaceTotal === '' || d.shahdSpaceTotal === null || isNaN(parseFloat(d.shahdSpaceTotal))){
    showToast('Enter the total dedicated Shahd space (units) before submitting');
    return;
  }
  {
    const shahdFacingsSum = d.items.reduce((s,it)=>s+(parseFloat(it.shahdFacings)||0),0);
    const catTotal = parseFloat(d.catFacingsTotal) || 0;
    if(shahdFacingsSum > catTotal && !d.extraDisplay){
      showToast(`Total Shahd facings (${shahdFacingsSum}) can't exceed total category facings (${catTotal}) — recheck your counts, or confirm the extra-display checkbox below the category facings box if this is real.`);
      return;
    }
  }
  const incompleteIdx = d.items.findIndex(it => !isItemComplete(it));
  if(incompleteIdx !== -1){
    const skuName = (SKU_MAP[d.items[incompleteIdx].skuId]||{}).name || 'a SKU';
    d.items[incompleteIdx]._open = true;
    showToast(`Enter all fields for "${skuName}" — use 0 if it's not stocked here`);
    render();
    return;
  }
  // Duplicate-visit guard: same account, same auditor, submitted very recently
  const dupe = State.visits.find(v => v.accountId===d.accountId && v.auditor===identityLabel() && v.date===todayStr() && v.status!=='rejected' && (Date.now()-(v.submittedAt||0)) < 12*3600*1000);
  if(dupe){
    const proceed = confirm('You already submitted a visit for this account today. Submit another anyway?');
    if(!proceed) return;
  }
  State.submitting = true; render();
  try{
    const visitId = uid();
    let uploadedPhotos;
    try{
      showToast('Uploading photo(s)…');
      uploadedPhotos = await uploadVisitPhotos(d.photos || [], visitId);
    }catch(uploadErr){
      console.error('Photo upload failed:', uploadErr);
      showToast('Photo upload failed — check your connection and try again. Your draft is safe.');
      return;
    }
    const finalItems = d.items.map(it => ({...it, catFacings: d.catFacingsTotal, shahdSpaceTotal: d.shahdSpaceTotal})); // two visit-level totals, copied to every line for compatibility with existing analysis
    const visit = {
      id: visitId,
      accountId: d.accountId, accountName: d.accountName, branch: d.branch,
      channel: d.channel || '', region: d.region || '',
      date: todayStr(), auditor: identityLabel(),
      status: 'pending', items: finalItems,
      photos: uploadedPhotos, geo: d.geo || null, capturedAt: d.capturedAt || null,
      arrivalId: d.arrivalId || null, arrivedAt: d.arrivedAt || null, extraDisplay: !!d.extraDisplay,
      submittedAt: Date.now(),
    };
    await visitCreate(visit);
    recordLocationLearning(visit); // fire-and-forget — don't block the submit confirmation on this
    if(d.arrivalId){ arrivalUpdate(d.arrivalId, {status:'completed', visitId}).catch(()=>{}); } // fire-and-forget, same reasoning
    State.draft = { accountId:'', accountName:'', branch:'', channel:'', region:'', date: todayStr(), items: [], photos: [], geo:null, capturedAt:null, catFacingsTotal:'', shahdSpaceTotal:'', extraDisplay:false, arrivalId:null, arrivedAt:null };
    clearDraftLocal();
    State.accountSearch = '';
    showToast(navigator.onLine ? 'Visit submitted for approval ✓' : "Saved on this device ✓ — will upload automatically once you're back online. You can move to the next visit now.");
    State.tab = 'myvisits';
  } catch(err){
    console.error(err);
    showToast('Could not submit — your draft is saved, try again when you have signal.');
  } finally {
    State.submitting = false; render();
  }
}

function showToast(msg){ State.toast = msg; if(!isTypingNow()) render(); setTimeout(()=>{ State.toast = null; if(!isTypingNow()) render(); }, 2200); }

/* ============================= PHOTO + GEO CAPTURE (multi-photo, 1-10) ============================= */
const MAX_PHOTOS = 10;
// Shared camera opener — capturePhoto() (shelf photos) and markArrival() (arrival photo) both use
// this, distinguished by State.cameraMode, so confirmCameraPhoto() knows which flow to feed the
// captured image into.
async function openCamera(){
  // Capture entirely in-page via the camera stream — this never hands off to the phone's native
  // camera app, so nothing gets saved to the phone's own photo gallery or eats into device storage.
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      State.cameraStream = stream;
      State.cameraPreview = null;
      State.cameraOpen = true;
      render();
      return true;
    }catch(e){
      console.error('in-page camera unavailable, falling back to native picker', e);
      // fall through to the file-input fallback
    }
  }
  return false;
}
async function capturePhoto(){
  if((State.draft.photos||[]).length >= MAX_PHOTOS){ showToast(`Max ${MAX_PHOTOS} photos per visit`); return; }
  State.cameraMode = 'visit';
  if(await openCamera()) return;
  capturePhotoFallback();
}
async function markArrival(){
  if(!State.draft.accountId){ showToast('Select an account first'); return; }
  if(State.draft.arrivalId || State.arrivalPending) return;
  State.cameraMode = 'arrival';

}
function capturePhotoFallback(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.onchange = async () => {
    const file = inp.files[0]; if(!file) return;
    showToast('Processing photo…');
    const dataUrl = await compressImage(file, 640, 0.55);
    addCapturedPhoto(dataUrl);
  };
  inp.click();
}
function arrivalPhotoFallback(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.onchange = async () => {
    const file = inp.files[0]; if(!file) return;
    showToast('Processing photo…');
    const dataUrl = await compressImage(file, 640, 0.55);
    finishArrival(dataUrl);
  };
  inp.click();
}
function addCapturedPhoto(dataUrl){
  State.draft.photos = State.draft.photos || [];
  State.draft.photos.push(dataUrl);
  State.draft.capturedAt = State.draft.capturedAt || Date.now();
  if(!State.draft.geo) captureGeo(); else { saveDraftLocal(); render(); }
}
// Marks the true start of the visit: creates an `arrivals` doc immediately (so supervisors see it
// live) and stamps the draft with arrivalId/arrivedAt, which visitDurationMinutes() and submitVisit()
// then use as the real on-site start time instead of the old proxy (first shelf photo).
// arrivalAttemptGen guards against duplicate arrival records: tapping "Cancel and retry" only ever
// reset the pending flag before, it never actually stopped the original write still running in the
// background — so an impatient cancel-then-retry could let BOTH attempts land a few seconds apart,
// producing two "on-site" cards for the same visit. Each attempt now carries its own generation
// number; if it's been superseded by the time its write finishes, it silently closes out whatever it
// just created instead of claiming the draft.
let arrivalAttemptGen = 0;
function haversineMeters(lat1,lng1,lat2,lng2){
  const R = 6371000, toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
// Catches "wrong customer selected" — e.g. physically at Oscar but picked Seoudi Waterway from the
// list — by comparing this arrival's GPS against every account's previously learned location
// (State.locations, built up from past visits' geo). If the captured point sits much closer to a
// DIFFERENT known account than to the one actually selected, that's a strong signal of a mis-pick.
// Advisory only, not a hard block: learned locations are sparse early on and GPS drifts indoors, so
// blocking submission on this would cause more harm than the errors it catches.
function checkLocationMismatch(accountId, geo){
  if(!geo) return null;
  let nearest = null, nearestDist = Infinity;
  Object.entries(State.locations||{}).forEach(([id, loc]) => {
    if(loc.accuracy != null && loc.accuracy > 100) return; // ignore low-precision learned points — too unreliable to compare against
    const dist = haversineMeters(geo.lat, geo.lng, loc.lat, loc.lng);
    if(dist < nearestDist){ nearestDist = dist; nearest = { id, ...loc }; }
  });
  if(!nearest || nearest.id === accountId || nearestDist >= 150) return null;
  const own = State.locations && State.locations[accountId];
  const ownDist = own ? haversineMeters(geo.lat, geo.lng, own.lat, own.lng) : Infinity;
  if(ownDist <= nearestDist + 100) return null; // selected account's own location is about as close — not a clear mismatch
  return { accountId: nearest.id, accountName: nearest.accountName, branch: nearest.branch, distance: Math.round(nearestDist) };
}
async function finishArrival(photoDataUrl){
  const myGen = ++arrivalAttemptGen;
  const d = State.draft;
  const arrivalId = uid();
  State.arrivalPending = true; render();
  try{
    let geo = d.geo;
    if(!geo){
      // Not wrapping this in a promise-based timeout before was the actual bug behind arrivals
      // getting stuck on "Marking arrival…" indefinitely — some Android browsers/WebViews simply
      // never invoke either callback if location is in a stuck permission/service state, ignoring
      // the `timeout` option entirely. withTimeout is the real safety net here.
      try{
        geo = await withTimeout(new Promise(resolve => {
          if(!navigator.geolocation){ resolve(null); return; }
          navigator.geolocation.getCurrentPosition(
            pos => resolve({ lat:+pos.coords.latitude.toFixed(5), lng:+pos.coords.longitude.toFixed(5), accuracy:Math.round(pos.coords.accuracy) }),
            () => resolve(null),
            { enableHighAccuracy:true, timeout:8000 }
          );
        }), 10000);
      }catch(e){ geo = null; } // timed out at the outer boundary — proceed without location rather than hang
    }
    let photoUrl = photoDataUrl;
    try{ photoUrl = await uploadVisitPhoto(photoDataUrl, arrivalId, 0); }catch(e){ console.error('Arrival photo upload failed, keeping embedded copy:', e); }
    const arrivedAt = Date.now();
    const mismatch = checkLocationMismatch(d.accountId, geo);
    const arrival = {
      id: arrivalId, accountId:d.accountId, accountName:d.accountName, branch:d.branch,
      channel:d.channel||'', region:d.region||'', auditor: identityLabel(),
      date: todayStr(), arrivedAt, photo: photoUrl, geo: geo||null, status:'active', visitId:null,
      locationMismatch: mismatch,
    };
    await arrivalCreate(arrival);
    if(myGen !== arrivalAttemptGen){
      // Cancelled and retried while this write was still in flight — it succeeded, but a newer
      // attempt has already taken over the draft. Close this one out immediately rather than leaving
      // a second "active" arrival sitting there for the same visit.
      arrivalUpdate(arrivalId, {status:'abandoned'}).catch(()=>{});
      return;
    }
    d.geo = geo||d.geo;
    d.arrivalId = arrivalId;
    d.arrivedAt = arrivedAt;
    d.capturedAt = d.capturedAt || arrivedAt;
    // The arrival photo becomes the visit's first shelf photo too — not a separate, invisible thing.
    // This is what makes step 2 open with the photo already sitting there (not an empty gallery that
    // looks like everything got wiped), and it's why a reload mid-visit restores cleanly: this photo
    // now lives in the same draft.photos array that saveDraftLocal()/restoreDraftIfAny() already
    // persist and restore, alongside every SKU field.
    d.photos = d.photos || [];
    if(d.photos.length === 0) d.photos.push(photoUrl);
    saveDraftLocal();
    if(mismatch){
      showToast(`⚠️ This location matches ${mismatch.accountName} (${mismatch.branch}), not ${d.accountName} — double check you picked the right customer.`);
    } else {
      showToast('Arrival marked ✓ — start the shelf check');
    }
  }catch(e){
    if(myGen === arrivalAttemptGen){
      console.error('Arrival mark failed', e);
      showToast('Could not mark arrival — check your connection and try again.');
    }
  } finally {
    if(myGen === arrivalAttemptGen){ State.arrivalPending = false; render(); }
  }
}
function attachCameraStream(){
  const video = document.getElementById('cam-live-video');
  if(video && State.cameraStream && !State.cameraPreview){ video.srcObject = State.cameraStream; video.play().catch(()=>{}); }
}
function snapPhoto(){
  const video = document.getElementById('cam-live-video');
  if(!video || !video.videoWidth){ showToast('Camera still starting — try again in a second'); return; }
  const maxDim = 640;
  let w = video.videoWidth, h = video.videoHeight;
  if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
  else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  State.cameraPreview = canvas.toDataURL('image/jpeg', 0.55);
  render();
}
function retakePhoto(){ State.cameraPreview = null; render(); }
function confirmCameraPhoto(){
  if(!State.cameraPreview) return;
  if(State.cameraMode === 'arrival') finishArrival(State.cameraPreview);
  else if(State.cameraMode === 'gallery') finishGalleryPhoto(State.cameraPreview);
  else addCapturedPhoto(State.cameraPreview);
  closeCamera();
}
function closeCamera(){
  if(State.cameraStream){ try{ State.cameraStream.getTracks().forEach(t=>t.stop()); }catch(e){} }
  State.cameraStream = null;
  State.cameraPreview = null;
  State.cameraOpen = false;
  render();
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    reader.readAsDataURL(file);
  });
}
function captureGeo(){
  if(!navigator.geolocation){ showToast('Location not supported on this device'); saveDraftLocal(); render(); return; }
  // Wrapped in withTimeout as an outer safety net — some Android browsers/WebViews never invoke
  // either callback at all when location is in a stuck permission/service state, silently ignoring
  // the per-call `timeout` option below. Without this, the "No location" state (and the retry
  // button) would just sit there with a request that's never actually going to resolve.
  const attempt = new Promise(resolve => {
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ ok:true, geo: { lat:+pos.coords.latitude.toFixed(5), lng:+pos.coords.longitude.toFixed(5), accuracy:Math.round(pos.coords.accuracy) } }),
      err => {
        // A first high-accuracy (GPS-only) attempt often fails or times out indoors, inside a store with
        // no clear sky view — that's a signal problem, not a permission problem. Retry once using
        // network/Wi-Fi-based positioning (enableHighAccuracy:false), which works far better indoors,
        // before concluding the visit should be flagged unverified.
        if(err.code !== 1 /* not an actual permission denial */){
          navigator.geolocation.getCurrentPosition(
            pos => resolve({ ok:true, geo: { lat:+pos.coords.latitude.toFixed(5), lng:+pos.coords.longitude.toFixed(5), accuracy:Math.round(pos.coords.accuracy) } }),
            err2 => resolve({ ok:false, err:err2 }),
            { enableHighAccuracy:false, timeout:15000, maximumAge:60000 }
          );
          return;
        }
        resolve({ ok:false, err });
      },
      { enableHighAccuracy:true, timeout:8000 }
    );
  });
  withTimeout(attempt, 25000).then(
    result => {
      if(result.ok){ State.draft.geo = result.geo; }
      else { State.draft.geo = null; showToast(geoErrorMessage(result.err)); }
      saveDraftLocal(); render();
    },
    () => { State.draft.geo = null; showToast(geoErrorMessage({code:3})); saveDraftLocal(); render(); }
  );
}
function cancelArrivalPending(){
  arrivalAttemptGen++; // invalidates whatever finishArrival() call is still in flight
  State.arrivalPending = false;
  render();
  showToast('Cancelled — tap Mark arrival to try again');
}
function geoErrorMessage(err){
  if(err.code === 1) return 'Location permission denied for this site — check Safari/Chrome site settings, then retry. Visit will be flagged unverified until then.';
  if(err.code === 2) return 'Could not get a location fix indoors — visit will be flagged unverified. You can retry, or continue without it.';
  return 'Location timed out — signal may be weak indoors. Visit will be flagged unverified. You can retry, or continue without it.';
}
function removePhotoAt(idx){ (State.draft.photos||[]).splice(idx,1); saveDraftLocal(); render(); }

/* ============================= RENDER HELPERS ============================= */
function fmt(n, d=0){
  if(Array.isArray(n)) n = n.length ? n[0] : 0; // defensive: some upstream field occasionally arrives as a 1-item array instead of a plain number
  n = Number(n);
  n = isFinite(n) ? n : 0;
  return n.toFixed(d);
}
function visitPhotos(v){ return (v.photos && v.photos.length) ? v.photos : (v.photo ? [v.photo] : []); }
/* Visit duration: from the arrival tap (real on-site start, once that flow exists on a visit) to
   submission — the most accurate figure we have. Older visits recorded before the arrival step
   existed fall back to first-photo-to-submission, a rougher proxy. Returns null when the relevant
   timestamps are missing or the gap is negative/implausible (e.g. clock skew from an offline draft
   synced later). */
function visitDurationMinutes(v){
  if(!v || !v.submittedAt) return null;
  const start = v.arrivedAt || v.capturedAt;
  if(!start) return null;
  const mins = (v.submittedAt - start) / 60000;
  if(!isFinite(mins) || mins < 0 || mins > 8*60) return null; // cap at 8h — treat longer gaps as offline-sync artifacts, not real dwell time
  return mins;
}
function fmtDuration(mins){
  if(mins === null || mins === undefined || !isFinite(mins)) return '—';
  const total = Math.round(mins);
  const h = Math.floor(total/60), m = total%60;
  return h>0 ? `${h}h ${m}m` : `${m}m`;
}
function fmtCoverage(days){
  if(Array.isArray(days)) days = days.length ? days[0] : 0;
  if(days === Infinity) return '∞'; // in stock, but zero sales recorded — technically never runs out
  if(!days || days<=0) return '—'; // no stock / no reading
  return fmt(days,1)+'d';
}
function statusChip(status, label){ return `<span class="chip ${status}">${label}</span>`; }
function barColor(pct){ return pct>=90?'var(--green)': pct>=70?'var(--amber)':'var(--red)'; }
function gauge(pct, label, size=64){
  pct = Math.max(0,Math.min(100,pct||0));
  const r = size/2-6, c = 2*Math.PI*r, off = c - (pct/100)*c;
  const color = barColor(pct);
  return `<div class="gauge-wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#EFEBE9" stroke-width="7" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="7" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="50%" y="53%" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${fmt(pct)}%</text>
    </svg>
    <div><div class="gauge-num" style="color:${color}">${fmt(pct)}%</div><div class="gauge-lbl">${label}</div></div>
  </div>`;
}
function emptyState(icon,title,sub){ return `<div class="empty"><div class="big">${icon}</div><p style="font-weight:700;color:var(--ink)">${title}</p><p>${sub}</p></div>`; }

/* Merchandiser visit-target lookup from route plan (best-effort name match) */
function targetForMerch(name){
  if(!name) return 0;
  return State.accounts.filter(a => (a.merch||'').trim() === name.trim()).reduce((s,a)=>s+(a.target||0),0);
}
function achievedForMerch(name){
  return State.visits.filter(v=>v.auditor===name).length;
}
function supervisorOfMerch(merchName){
  const counts = {};
  State.accounts.forEach(a=>{ if((a.merch||'').trim()===(merchName||'').trim() && a.sup){ counts[a.sup]=(counts[a.sup]||0)+1; } });
  let best=null, bestN=0;
  Object.entries(counts).forEach(([s,n])=>{ if(n>bestN){ best=s; bestN=n; } });
  return best;
}
function myMerchandisers(){
  const all = [...new Set(State.accounts.map(a=>(a.merch||'').trim()).filter(Boolean))];
  if(State.role==='supervisor') return all.filter(n=>supervisorOfMerch(n)===State.name);
  return all;
}

function myAccounts(){
  if(State.role==='merchandiser'){
    // Matched by code first (stable — doesn't drift with inconsistent Arabic name spelling across
    // imported account rows for the same real person), falling back to a trimmed name match for
    // accounts/delegations from before codes were tracked. This is what was silently breaking
    // delegation: the old code compared toMerch to State.name with a strict, untrimmed ===, right
    // next to an "own accounts" check that already trimmed both sides defensively — a name-string
    // variant that didn't exactly match (extra space, different row's spelling) just vanished.
    const own = State.accounts.filter(a =>
      (a.merchCode && State.merchCode && a.merchCode===State.merchCode) ||
      (a.merch||'').trim()===State.name.trim()
    );
    const ownIds = new Set(own.map(a=>a.id));
    const delegatedIds = new Set(State.delegations.filter(x => x.date===State.draft.date && (
      (x.toMerchCode && State.merchCode && x.toMerchCode===State.merchCode) ||
      (x.toMerch||'').trim()===State.name.trim()
    )).map(x=>x.accountId));
    const delegated = State.accounts.filter(a=>delegatedIds.has(a.id) && !ownIds.has(a.id));
    return [...own, ...delegated];
  }
  return State.accounts;
}

async function closeArrival(id){
  if(!confirm('Close this arrival? The merchandiser will be able to mark a fresh arrival at this store next time.')) return;
  try{ await arrivalUpdate(id, {status:'abandoned'}); showToast('Arrival closed ✓'); }
  catch(e){ console.error(e); showToast('Could not close — check your connection and try again.'); }
}
async function closeStaleArrivals(){
  const stale = State.arrivals.filter(a=>a.status==='active' && (Date.now()-a.arrivedAt) >= STALE_ARRIVAL_MINUTES*60000);
  if(stale.length===0){ showToast('Nothing stale to close'); return; }
  if(!confirm(`Close ${stale.length} arrival${stale.length===1?'':'s'} stuck for over a day? Each merchandiser will be able to mark a fresh arrival at their store next time.`)) return;
  showToast('Closing…');
  for(const a of stale){ try{ await arrivalUpdate(a.id, {status:'abandoned'}); }catch(e){ console.error(e); } }
  showToast('Closed ✓');
}
/* ---- Arrivals (live "who's on-site now" + recent arrival history) ---- */
// A day+ stuck "active" is almost certainly an abandoned draft (app closed mid-visit, device changed,
// never got back to submit) rather than a genuine multi-day visit — worth a manual close so it stops
// cluttering the "on-site now" view and the merchandiser can start clean the next day. Management-only
// (Merch Head / Trade Marketing), not Supervisor — this is data hygiene across the whole roster, not
// day-to-day team management.
const STALE_ARRIVAL_MINUTES = 24*60;
function screenArrivals(){
  const mySet = new Set(myMerchandisers());
  const scoped = State.arrivals.filter(a => State.role!=='supervisor' || mySet.has(a.auditor));
  const active = scoped.filter(a=>a.status==='active');
  const recent = scoped.filter(a=>a.status!=='active').slice(0, 20);
  const canClose = State.role==='merch_head' || State.role==='trade_marketing';
  const staleCount = active.filter(a=>(Date.now()-a.arrivedAt) >= STALE_ARRIVAL_MINUTES*60000).length;
  return `<div class="screen">
    <h1>Arrivals / الوصول</h1>
    <p class="lede">Live view of who's on-site right now, and recent arrivals.</p>
    ${canClose && staleCount>0 ? `<button class="btn btn-danger btn-sm" style="margin-bottom:10px" onclick="closeStaleArrivals()">Close ${staleCount} arrival${staleCount===1?'':'s'} stuck over a day</button>` : ''}
    <div class="sectitle">On-site now — ${active.length} / متواجدون الآن</div>
    ${active.map(a=>arrivalCardHtml(a,true,canClose)).join('') || emptyState('📍','Nobody currently checked in','Arrivals show up here the moment a merchandiser marks arrival.')}
    ${recent.length ? `<div class="sectitle" style="margin-top:16px">Recent / الأخيرة</div>${recent.map(a=>arrivalCardHtml(a,false,false)).join('')}` : ''}
  </div>`;
}
function arrivalCardHtml(a, isActive, canClose){
  const rawElapsedMins = isActive ? (Date.now()-a.arrivedAt)/60000 : null;
  // A negative value means the arrival timestamp is in the future relative to whoever's viewing this —
  // not a display bug, but a real device clock mismatch on the merchandiser's phone (wrong time/timezone
  // setting). Worth flagging distinctly rather than silently showing "-29m", since a wrong clock could
  // also be quietly skewing that device's other timestamp-based data (visit duration, "today" date lock).
  const clockMismatch = isActive && rawElapsedMins < 0;
  const elapsedMins = isActive ? Math.max(0, rawElapsedMins) : null;
  const statusLabel = a.status==='active' ? 'on-site' : a.status==='completed' ? 'completed' : 'abandoned';
  const statusColor = a.status==='active' ? 'watch' : a.status==='completed' ? 'on' : 'off';
  // For a completed arrival, pull the actual completion duration from the linked visit — same
  // arrival-to-submission figure the notification fired on — so the flag here matches exactly.
  const linkedVisit = (a.status==='completed' && a.visitId) ? State.visits.find(v=>v.id===a.visitId) : null;
  const completionMins = linkedVisit ? visitDurationMinutes(linkedVisit) : null;
  const flagFast = completionMins !== null && completionMins < SHORT_COMPLETION_MINUTES;
  const flagLong = isActive && !clockMismatch && elapsedMins >= LONG_ONSITE_MINUTES;
  const isStale = isActive && !clockMismatch && elapsedMins >= STALE_ARRIVAL_MINUTES;
  return `<div class="card"${(flagFast||flagLong||clockMismatch||a.locationMismatch)?' style="border-color:var(--red)"':''}>
    <div class="visit-row" style="border:none;padding:0 0 8px;">
      <div><div class="visit-main">${a.auditor}</div><div class="visit-sub">${a.accountName} · ${a.branch}</div></div>
      ${statusChip(statusColor, statusLabel)}
    </div>
    <div class="verify-row" style="margin-bottom:8px">
      ${statusChip('neutral', '🕐 Arrived ' + new Date(a.arrivedAt).toLocaleTimeString())}
      ${isActive ? statusChip(clockMismatch?'off':(flagLong?'off':(elapsedMins>60?'watch':'neutral')), clockMismatch?'⏱ time unknown':'⏱ ' + fmtDuration(elapsedMins) + ' on-site') : ''}
      ${completionMins !== null ? statusChip(flagFast?'off':'on', '⏱ ' + fmtDuration(completionMins) + ' total') : ''}
      ${clockMismatch ? statusChip('off', '📵 Device clock mismatch — check phone time/timezone settings') : ''}
      ${a.locationMismatch ? statusChip('off', `🚩 Wrong customer? Location matches ${a.locationMismatch.accountName} (${a.locationMismatch.branch}), ~${a.locationMismatch.distance}m away`) : ''}
      ${flagFast ? statusChip('off', '🔍 Investigate — too fast for a full visit') : ''}
      ${flagLong ? statusChip('off', '🔍 Investigate — unusually long on-site') : ''}
      ${a.geo ? statusChip('on','📍 Location captured / تم تحديد الموقع') : statusChip('off','⚠️ No location')}
    </div>
    ${a.photo ? `<img src="${a.photo}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="window.open('${a.photo}')"/>` : ''}
    ${canClose && isActive ? `<button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="closeArrival('${a.id}')">${isStale?'Close — stuck over a day':'Close arrival'}</button>` : ''}
  </div>`;
}

  const customers = computeCustomerAnalysis(approved);
