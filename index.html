    return `<div class="card">
      <div class="branch-toggle" onclick="toggleCategory('photodash:${c.name.replace(/'/g,"\\'")}')">
        <div><div class="visit-main">${c.name}</div><div class="visit-sub">${c.photos.length} photo${c.photos.length===1?'':'s'} across ${Object.keys(byBranch).length} branch${Object.keys(byBranch).length===1?'':'es'}</div></div>
        <div style="font-size:16px">${open?'−':'+'}</div>
      </div>
      ${open ? Object.entries(byBranch).map(([branch,photos])=>`
        <div class="hint" style="font-weight:700;margin:10px 0 6px">${branch}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
          ${photos.map(p=>`<div style="position:relative">
            <img src="${p.photo}" title="${p.auditor} · ${p.date}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="window.open('${p.photo}')"/>
            ${canDelete ? `<button class="remove-x" style="position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;padding:0;font-size:13px;line-height:20px" onclick="deleteVisitPhotoPrompt('${p.visitId}','${p.photo.replace(/'/g,"\\'")}')">✕</button>` : ''}
          </div>`).join('')}
        </div>
      `).join('') : ''}
    </div>`;
  }).join('');
}
function dashOverview(approved){
  const aggs = approved.map(v=>visitAggregate(v));
  const avg = f => aggs.reduce((s,a)=>s+f(a),0)/aggs.length;
  // SUC/SOS/OSA/Price-matching are "current state" figures — like the Customers screen and the SUC/SOS
  // monitor, they're built from each branch's LATEST visit only (code-based identity, so a duplicate
  // account doesn't let a stale reading dodge being superseded), not blended across every historical
  // visit. Averaging in every past visit was exactly what made the network-wide numbers look far more
  // inflated than what's actually true today. Visit-count-based figures below (verified %, duration)
  // are a different kind of metric — about the visiting itself, not the shelf's current state — so
  // those stay as an average across every visit, same as visit counts elsewhere in the app.
  const latestVisits = findLatestVisitPerBranch(approved);
  const latestAggs = latestVisits.map(v=>visitAggregate(v));
  const avgLatest = f => latestAggs.length ? latestAggs.reduce((s,a)=>s+f(a),0)/latestAggs.length : 0;
  const stockSummary = computeNetworkStockSummary(approved);
  const durations = approved.map(visitDurationMinutes).filter(m=>m!==null);
  const avgDuration = durations.length ? durations.reduce((s,m)=>s+m,0)/durations.length : null;
  return `<div class="kpi-grid">
    <div class="kpi accent"><div class="num">${fmt(avgLatest(a=>a.avgSfr))}%</div><div class="lbl">Avg shelf utilization (SUC) / متوسط تعبئة الرف</div></div>
    <div class="kpi"><div class="num">${fmt(avgLatest(a=>a.avgSos))}%</div><div class="lbl">Avg share of shelf (SOS) / متوسط حصة الرف</div></div>
    <div class="kpi"><div class="num">${fmt(avgLatest(a=>a.osaPct))}%</div><div class="lbl">On-shelf availability (OSA) / التوافر على الرف</div></div>
    <div class="kpi"><div class="num">${fmt(avgLatest(a=>a.priceOkPct))}%</div><div class="lbl">Price matching RSP / مطابقة السعر</div></div>
    <div class="kpi accent"><div class="num">${fmt(stockSummary.totalStock)}</div><div class="lbl">Total stock on hand (grand total) / إجمالي المخزون</div></div>
    <div class="kpi"><div class="num">${fmt(stockSummary.avgCoverage,1)}d</div><div class="lbl">Avg stock coverage / تغطية المخزون</div></div>
    <div class="kpi"><div class="num">${fmt(aggs.filter(a=>a.hasPhoto&&a.hasGeo).length/aggs.length*100)}%</div><div class="lbl">Visits verified / الزيارات الموثقة</div></div>
    <div class="kpi"><div class="num">${avgDuration!==null?fmtDuration(avgDuration):'—'}</div><div class="lbl">Avg visit duration (photo→submit) / متوسط مدة الزيارة</div></div>
  </div>`;
}

/* Canonical customer-name mapping — the same physical chain gets typed differently across
   different route-cycle imports over time (e.g. "Seoudi" / "Seoudi Market" / "Market Seoudi"),
   which fractures one real customer into several separate cards even after accounts are matched
   on branch/code. This collapses known spelling variants onto one canonical display name before
   grouping, so the Dashboard, Customers screen, PPT export, and Opportunities — everything that
   reads through computeCustomerAnalysis below — show one unified customer right away. It only
   affects how visits are grouped for display; it doesn't rename the underlying account records,
   so running the account-merge cleanup is still worth doing to keep new imports and galleries
   (which key off accountId, not this) consistent too. Add more chains/variants here as needed. */
const CUSTOMER_NAME_ALIASES = {
  'سعودي': ['سعودي', 'سعودى', 'سعودي سوبر ماركت', 'سوبر ماركت سعودي', 'سعودى سوبر ماركت', 'سوبر ماركت سعودى'],
};
const CUSTOMER_NAME_CANONICAL_LOOKUP = (() => {
  const lookup = {};
  Object.entries(CUSTOMER_NAME_ALIASES).forEach(([canon, variants])=>{
    variants.forEach(v=>{ lookup[v] = canon; });
  });
  return lookup;
})();
function canonicalCustomerName(name){
  const n = (name||'').trim();
  return CUSTOMER_NAME_CANONICAL_LOOKUP[n] || n;
}
/* Shared aggregation used by both on-screen Customer Analysis and the PPT export */
function computeCustomerAnalysis(approved){
  const byCustomer = {};
  // A branch's true identity is its account's customer/location code (CUSTOMER_NUMBER_LOCATION_ID),
  // not its free-text name — two account records for the exact same physical store can end up with
  // different branch text, or even a different customer-name spelling, if they were created from
  // different imports (e.g. "سعودي سيتي ستارز" and "سعودي سوبر ماركت سيتي ستارز" sharing one code).
  // Resolving each visit's account here means both feed into the SAME branch bucket below, so its
  // "current state" figures (SUC/SOS/stock/last-visited) come from whichever of the two has the
  // truly most recent visit, while velocity stays a trend built from both accounts' full history
  // combined rather than losing whichever one didn't "win". Falls back to branch text only for
  // accounts that don't have a code on file yet.
  const accountsById = {};
  State.accounts.forEach(a=>{ accountsById[a.id] = a; });
  const sorted = [...approved].sort((a,b)=>(a.submittedAt||0)-(b.submittedAt||0)); // process oldest→newest so "latest" tracking below stays correct
  sorted.forEach(v=>{
   try{
    const agg = visitAggregate(v);
    const custName = canonicalCustomerName(v.accountName);
    byCustomer[custName] = byCustomer[custName] || { name:custName, branches:{}, photos:[] };
    const c = byCustomer[custName];
    const acct = accountsById[v.accountId];
    const branchKey = (acct && acct.customerId) ? acct.customerId : (v.branch||'').trim().toLowerCase();
    c.branches[branchKey] = c.branches[branchKey] || { branch:v.branch, visits:0, lastVisitDate:null, latestSfr:0, latestSos:0, latestOsaPct:0, latestCatFacingsTotal:0, latestShahdSpaceTotal:0, latestShahdFacingsTotal:0, latestExtraDisplay:false, skuStats:{}, accountIds:new Set() };
    const b = c.branches[branchKey];
    b.accountIds.add(v.accountId);
    b.visits++;
    // Every figure in the branch header — SUC%, SOS%, OSA%, and the absolute totals — plus every
    // per-SKU reading below (price, stock, out-of-stock status), plus the branch LABEL itself, comes
    // from this SAME single latest visit, not an average or a running tally mixed in from every
    // historical visit (or every duplicate account) at this branch. `sorted` runs oldest→newest, so
    // each later visit correctly overwrites the previous "latest". This keeps Price OK% and
    // out-of-stock counts from being dragged down by an old bad reading that a later, corrected
    // visit has since superseded — the same rule already applied to SUC/SOS/OSA.
    b.branch = v.branch;
    b.lastVisitDate = v.date;
    b.latestSfr = agg.avgSfr; b.latestSos = agg.avgSos; b.latestOsaPct = agg.osaPct;
    b.latestCatFacingsTotal = agg.catFacingsTotal;
    b.latestShahdSpaceTotal = agg.shahdSpaceTotal;
    b.latestShahdFacingsTotal = agg.shahdFacingsTotal;
    b.latestExtraDisplay = !!v.extraDisplay;
    visitPhotos(v).forEach(p=>c.photos.push({photo:p, branch:v.branch, date:v.date, visitId:v.id, auditor:v.auditor}));
    agg.items.forEach(it=>{
      const sku = SKU_MAP[it.skuId]; if(!sku) return;
      const priceVal = parseFloat(it.actualPrice);
      b.skuStats[sku.id] = b.skuStats[sku.id] || { name:sku.name, category:sku.category, rsp:sku.rsp||0, velSum:0, velN:0, priceStatus:'neutral', latestPrice:0, latestStock:0, latestCapacity:0, latestSfr:0, latestSos:0, latestSosVsShahd:0, latestShahdFacings:0, isOos:false };
      const bs = b.skuStats[sku.id];
      if(it.calc.velocity>0){ bs.velSum += it.calc.velocity; bs.velN++; } // velocity stays a genuine trend across visits, not a "latest" snapshot
      bs.isOos = it.calc.osa==='N'; // overwritten each pass — reflects only the latest visit's stock check, not every past one
      if(!isNaN(priceVal) && priceVal>0){ bs.latestPrice = priceVal; bs.priceStatus = it.calc.priceStatus; } // overwritten each pass — ends on the most recent visit's reading, not an average
      bs.latestStock = it.calc.actualShelfStock; // overwritten each pass — ends on the most recent visit's reading
      bs.latestCapacity = parseFloat(it.actualCapacity) || 0; // facings actually on shelf, latest visit
      bs.latestShahdFacings = parseFloat(it.shahdFacings) || 0; // this SKU's own facing count, latest visit
      // Recomputed directly against THIS visit's resolved dedicated-space total (the same figure shown
      // in the branch header) rather than trusting it.calc.sfr as-is — for legacy visits, calc.sfr is
      // deliberately computed a different way internally (against that SKU's own old individual target,
      // kept for a separate, safely-bounded scoring metric elsewhere) which would otherwise show a
      // number here that doesn't match the total sitting right next to it in the header. Marinated
      // Fresh still needs its own exclusion applied here too, same as it.calc.sfr/sos/sosVsShahd —
      // this recompute bypasses that object entirely, so it has to be re-checked explicitly.
      bs.latestSfr = it.calc.excludedFromSucSos ? null : (agg.shahdSpaceTotal > 0 ? Math.min(300, (bs.latestCapacity / agg.shahdSpaceTotal) * 100) : 0);
      bs.latestSos = it.calc.sos; // this SKU's share of total category facings, latest visit
      bs.latestSosVsShahd = it.calc.sosVsShahd; // this SKU's share of total Shahd facings, latest visit
    });
   }catch(e){ console.error('Skipping malformed visit in customer analysis:', v && v.id, e); }
  });
  return Object.values(byCustomer).map(c=>{
    const branches = Object.values(c.branches).map(b=>{
      const skuList = Object.entries(b.skuStats).map(([skuId,bs])=>{
        const avgVel = bs.velN?bs.velSum/bs.velN:0;
        // Coverage uses the SAME average velocity shown as "Vel/d" (not a single latest-visit reading), paired with the latest stock count.
        const coverageDays = avgVel>0 ? bs.latestStock/avgVel : (bs.latestStock>0 ? Infinity : 0);
        return {
          id:skuId, name:bs.name, category:bs.category, rsp:bs.rsp,
          avgVel,
          actualPrice: bs.latestPrice||0,
          priceStatus: bs.priceStatus||'neutral', isOos: bs.isOos, oosCount: bs.isOos?1:0, n:1,
          stock: bs.latestStock||0, coverageDays, shahdFacings: bs.latestShahdFacings||0,
          capacity: bs.latestCapacity||0, sfr: bs.latestSfr, sos: bs.latestSos, sosVsShahd: bs.latestSosVsShahd,
        };
      }).sort((a,b2)=>b2.avgVel-a.avgVel);
      // Price OK% for this branch, from each SKU's LATEST reading here — not a tally that keeps
      // counting every historical visit. A bad price entry from months ago no longer drags this down
      // once a later visit corrected it.
      const pricedSkus = skuList.filter(s=>s.priceStatus!=='neutral');
      const priceOkPct = pricedSkus.length ? pricedSkus.filter(s=>s.priceStatus==='on').length/pricedSkus.length*100 : 0;
      return {
        branch:b.branch, sfr:b.latestSfr, sos:b.latestSos, osaPct:b.latestOsaPct, lastVisitDate:b.lastVisitDate,
        priceOkPct, visits:b.visits, accountIds:[...b.accountIds],
        catFacingsTotal: b.latestCatFacingsTotal, shahdSpaceTotal: b.latestShahdSpaceTotal, shahdFacingsTotal: b.latestShahdFacingsTotal, extraDisplay: b.latestExtraDisplay,
        skuList,
      };
    });
    const skuIds = new Set();
    branches.forEach(b=>b.skuList.forEach(s=>skuIds.add(s.id)));
    const skuList = [...skuIds].map(skuId=>{
      // Every network-wide figure below is built from each branch's LATEST reading of this SKU
      // (`readings`, already latest-only from the branch rollup above) — not from every historical
      // visit at every branch. A branch that had a bad reading months ago and has since been visited
      // correctly isn't still dragged down by that old number.
      const readings = branches.map(b=>b.skuList.find(x=>x.id===skuId)).filter(Boolean);
      const meta = readings[0];
      const velVals = readings.filter(r=>r.avgVel>0).map(r=>r.avgVel);
      const totalVelNetwork = velVals.reduce((a,b2)=>a+b2,0);
      const stockAcrossBranches = readings.reduce((s,r)=>s+(r.stock||0),0);
      const coverageVals = readings.map(r=>r.coverageDays).filter(x=>x>0 && isFinite(x));
      const hasInfiniteCoverage = readings.some(r=>r.coverageDays===Infinity);
      const sfrVals = readings.map(r=>r.sfr).filter(v=>v!=null);
      const sosVsShahdVals = readings.map(r=>r.sosVsShahd).filter(v=>v!=null);
      const pricedReadings = readings.filter(r=>r.priceStatus!=='neutral');
      const oosCount = readings.filter(r=>r.isOos).length;
      return {
        name: meta.name, category: meta.category, rsp: meta.rsp,
        avgVelPerStore: velVals.length ? velVals.reduce((a,b2)=>a+b2,0)/velVals.length : 0, totalVelNetwork,
        sfr: sfrVals.length ? sfrVals.reduce((a,b2)=>a+b2,0)/sfrVals.length : null,
        osaPct: readings.length ? (readings.length-oosCount)/readings.length*100 : 0,
        sosVsShahd: sosVsShahdVals.length ? sosVsShahdVals.reduce((a,b2)=>a+b2,0)/sosVsShahdVals.length : null,
        priceOkPct: pricedReadings.length ? pricedReadings.filter(r=>r.priceStatus==='on').length/pricedReadings.length*100 : 0,
        actualPrice: meta.actualPrice||0,
        oosCount, visits: readings.length, coverage: readings.length - oosCount,
        totalStock: stockAcrossBranches, avgCoverageDays: coverageVals.length ? coverageVals.reduce((a,b2)=>a+b2,0)/coverageVals.length : (hasInfiniteCoverage ? Infinity : 0),
      };
    }).sort((a,b)=>b.avgVelPerStore-a.avgVelPerStore);
    const catMap = {};
    skuList.forEach(s=>{
      catMap[s.category] = catMap[s.category] || { category:s.category, sfrSum:0, sosSum:0, velSum:0, n:0 };
      const cc = catMap[s.category];
      cc.sfrSum += (s.sfr||0); cc.velSum += s.avgVelPerStore; cc.n++;
    });
    const categories = Object.values(catMap).filter(cc=>cc.category!=='Marinated Fresh').map(cc=>({ category:cc.category, avgSfr: cc.sfrSum/cc.n, avgVelPerStore: cc.velSum/cc.n })).sort((a,b)=>b.avgSfr-a.avgSfr);
    const available = skuList.filter(s=>s.oosCount < s.visits).length;
    const topSku = skuList.filter(s=>s.avgVelPerStore>0)[0];
    const oosSku = [...skuList].sort((a,b)=>b.oosCount-a.oosCount)[0];
    const overallSfr = branches.reduce((s,b)=>s+b.sfr,0)/branches.length;
    const overallSos = branches.reduce((s,b)=>s+b.sos,0)/branches.length;
    const overallPriceOk = branches.reduce((s,b)=>s+b.priceOkPct,0)/branches.length;
    const totalStockCustomer = skuList.reduce((s,x)=>s+x.totalStock,0);
    const coverageAllVals = skuList.map(x=>x.avgCoverageDays).filter(x=>x>0 && isFinite(x));
    const avgCoverageCustomer = coverageAllVals.length ? coverageAllVals.reduce((a,b)=>a+b,0)/coverageAllVals.length : 0;
    return {
      name: c.name, branchCount: branches.length, branches, categories, skuList,
      avgSfr: overallSfr, avgSos: overallSos,
      skusAvailable: available, skusTotal: skuList.length,
      topSkuName: topSku ? topSku.name : '—', topSkuVel: topSku ? topSku.avgVelPerStore : 0,
      oosSkuName: (oosSku && oosSku.oosCount>0) ? oosSku.name : '—', oosCount: oosSku ? oosSku.oosCount : 0,
      priceOkPct: overallPriceOk,
      totalStock: totalStockCustomer, avgCoverageDays: avgCoverageCustomer,
      photos: c.photos,
    };
  }).sort((a,b)=>b.avgSfr-a.avgSfr);
}

function computeNetworkStockSummary(approved){
  const accountsById = {};
  State.accounts.forEach(a=>{ accountsById[a.id] = a; });
  const sorted = [...approved].sort((a,b)=>(a.submittedAt||0)-(b.submittedAt||0));
  const stats = {}; // key: customer||branchCode||sku -> {latestStock, velSum, velN}
  sorted.forEach(v=>{
    const custName = canonicalCustomerName(v.accountName);
    const acct = accountsById[v.accountId];
    const branchKey = (acct && acct.customerId) ? acct.customerId : (v.branch||'').trim().toLowerCase();
    (v.items||[]).forEach(it=>{
      const c = computeItem(it);
      // Same code-based branch identity as everywhere else — otherwise a duplicate account for the
      // same physical store double-counts its stock into the network total instead of just showing
      // the one true latest reading.
      const key = custName+'||'+branchKey+'||'+it.skuId;
      stats[key] = stats[key] || { latestStock:0, velSum:0, velN:0 };
      stats[key].latestStock = c.actualShelfStock;
      if(c.velocity>0){ stats[key].velSum += c.velocity; stats[key].velN++; }
    });
  });
  const entries = Object.values(stats);
  const totalStock = entries.reduce((s,e)=>s+e.latestStock,0);
  const coverageVals = entries.map(e=>{
    const avgVel = e.velN ? e.velSum/e.velN : 0;
    return avgVel>0 ? e.latestStock/avgVel : 0; // exclude zero-velocity (infinite) entries from the network average, same as elsewhere
  }).filter(c=>c>0);
  const avgCoverage = coverageVals.length ? coverageVals.reduce((a,b)=>a+b,0)/coverageVals.length : 0;
  return { totalStock, avgCoverage };
}

/* Shared aggregation used by both on-screen Category Analysis and the PPT export */
function computeCategoryAnalysis(approved){
  const byCat = {}, bySku = {};
  const totalStores = new Set(approved.map(v=>v.accountName+' · '+v.branch)).size;
  // Utilization (SUC) and SOS are tracked per store+SKU and overwritten on every later visit — sorted
  // oldest→newest below, so what survives is always each store's LATEST reading, not an average
  // blended with however many visits (some possibly bad, from before the calc-engine fixes) came
  // before it. Velocity/price/OOS stay as genuine running tallies across all visits — those are
  // meant to reflect activity over time, not a single current snapshot.
  const sorted = [...approved].sort((a,b)=>(a.submittedAt||0)-(b.submittedAt||0));
  const latestReading = {}; // key: "account · branch|skuId" -> {sfr, sos, sosVsShahd, category, skuId}
  sorted.forEach(v=>{
   try{
    const agg = visitAggregate(v);
    const storeKey = v.accountName+' · '+v.branch;
    agg.items.forEach(it=>{
      const sku = SKU_MAP[it.skuId]; if(!sku) return;
      byCat[sku.category] = byCat[sku.category] || { sfrSum:0, sfrN:0, sosSum:0, sosN:0 };
      bySku[sku.id] = bySku[sku.id] || { name:sku.name, category:sku.category, sfrSum:0, sfrN:0, sosSum:0, sosN:0, sosVsShahdSum:0, sosVsShahdN:0, velSum:0, velN:0, priceOk:0, priceAbove:0, priceN:0, n:0, storesCarrying:new Set() };
      const b = bySku[sku.id];
      b.n++;
      if(it.calc.osa==='Y') b.storesCarrying.add(storeKey);
      if(it.calc.velocity>0){ b.velSum += it.calc.velocity; b.velN++; }
      if(it.calc.priceStatus!=='neutral'){ b.priceN++; if(it.calc.priceStatus==='on') b.priceOk++; if(it.calc.priceStatus==='watch') b.priceAbove++; }
      latestReading[storeKey+'|'+sku.id] = { sfr: it.calc.sfr, sos: it.calc.sos, sosVsShahd: it.calc.sosVsShahd, category: sku.category, skuId: sku.id };
    });
   }catch(e){ console.error('Skipping malformed visit in category analysis:', v && v.id, e); }
  });
  Object.values(latestReading).forEach(r=>{
    if(r.sfr!=null){ byCat[r.category].sfrSum += r.sfr; byCat[r.category].sfrN++; bySku[r.skuId].sfrSum += r.sfr; bySku[r.skuId].sfrN++; }
    if(r.sos!=null){ byCat[r.category].sosSum += r.sos; byCat[r.category].sosN++; bySku[r.skuId].sosSum += r.sos; bySku[r.skuId].sosN++; }
    if(r.sosVsShahd!=null){ bySku[r.skuId].sosVsShahdSum += r.sosVsShahd; bySku[r.skuId].sosVsShahdN++; }
  });
  // Marinated Fresh is excluded from the SUC/SOS story entirely (a different category/shelf) — its
  // row here would only ever read 0%/0%, which isn't a real reading, so it's left out of this table
  // rather than showing a misleading zero.
  const catRows = Object.entries(byCat).filter(([cat])=>cat!=='Marinated Fresh').map(([cat,c])=>({category:cat, avgSfr: c.sfrN?c.sfrSum/c.sfrN:0, avgSos: c.sosN?c.sosSum/c.sosN:0})).sort((a,b)=>b.avgSfr-a.avgSfr);
  const skuRows = Object.values(bySku).map(s=>({
    ...s, avgVelPerStore: s.velN?s.velSum/s.velN:0, totalVelNetwork: s.velSum,
    avgSfr: s.sfrN?s.sfrSum/s.sfrN:0, avgSos: s.sosN?s.sosSum/s.sosN:0, avgSosVsShahd: s.sosVsShahdN?s.sosVsShahdSum/s.sosVsShahdN:0, priceOkPct: s.priceN?s.priceOk/s.priceN*100:0,
    aboveRspPct: s.priceN?s.priceAbove/s.priceN*100:0,
    coveragePct: totalStores ? s.storesCarrying.size/totalStores*100 : 0, coverageCount: s.storesCarrying.size,
  })).sort((a,b)=>b.avgVelPerStore-a.avgVelPerStore);
  return { catRows, skuRows, totalStores };
}

/* Opportunity detection: same SKU performs very differently across branches. Uses the SAME identity
   resolution as computeCustomerAnalysis — canonical customer name + code-based branch key — so two
   duplicate accounts for the same physical branch are one entry here too, not two competing ones
   (which could otherwise flag a branch as "underperforming" against its own duplicate record). */
function computeOpportunities(approved){
  const bySku = {};
  const accountsById = {};
  State.accounts.forEach(a=>{ accountsById[a.id] = a; });
  const sorted = [...approved].sort((a,b)=>(a.submittedAt||0)-(b.submittedAt||0)); // oldest→newest, so the latest-only tracking below stays correct
  sorted.forEach(v=>{
    const agg = visitAggregate(v);
    const custName = canonicalCustomerName(v.accountName);
    const acct = accountsById[v.accountId];
    const branchKey = (acct && acct.customerId) ? acct.customerId : (v.branch||'').trim().toLowerCase();
    const groupKey = custName+'||'+branchKey; // stable join key — same identity as computeCustomerAnalysis's branch buckets
    agg.items.forEach(it=>{
      const sku = SKU_MAP[it.skuId]; if(!sku) return;
      bySku[sku.id] = bySku[sku.id] || { name:sku.name, category:sku.category, byAccount:{} };
      bySku[sku.id].byAccount[groupKey] = bySku[sku.id].byAccount[groupKey] || { velSum:0, velN:0, isOos:false, visits:0, label:'' };
      const a = bySku[sku.id].byAccount[groupKey];
      a.visits++;
      a.label = custName+' · '+v.branch; // overwritten each pass — ends on the latest visit's branch text, matching the label computeCustomerAnalysis shows for this same branch
      a.isOos = it.calc.osa==='N'; // overwritten each pass — reflects only the latest visit's stock check, not a historical rate across every visit
      if(it.calc.velocity>0){ a.velSum += it.calc.velocity; a.velN++; } // velocity stays a genuine trend across visits (and across a merged duplicate account's own history), not a "latest" snapshot
    });
  });
  const opportunities = [];
  Object.values(bySku).forEach(sku=>{
    const accounts = Object.values(sku.byAccount).map(a=>({acc:a.label, vel: a.velN?a.velSum/a.velN:0, isOos:a.isOos}));
    const selling = accounts.filter(a=>a.vel>0);
    if(selling.length < 2) return;
    const best = selling.reduce((m,a)=>a.vel>m.vel?a:m, selling[0]);
    accounts.forEach(a=>{
      if(a.acc===best.acc) return;
      if(best.vel<=0) return;
      if(a.vel > 0 && a.vel < best.vel*0.5){
        opportunities.push({ type:'underperform', sku: sku.name, category: sku.category, branch: a.acc, velocity: a.vel, benchmark: best.vel, benchmarkBranch: best.acc, gap: best.vel - a.vel });
      } else if(a.isOos && best.vel >= 1){
        // OOS trigger is the LATEST visit's stock check only, not "OOS in at least half of past visits" —
        // an old stockout that a later visit already resolved no longer flags this as an opportunity.
        opportunities.push({ type:'oos', sku: sku.name, category: sku.category, branch: a.acc, velocity: 0, benchmark: best.vel, benchmarkBranch: best.acc, gap: best.vel });
      }
    });
  });
  return opportunities.sort((a,b)=>b.gap-a.gap);
}
function computeCustomerOpportunities(approved){
  const customers = computeCustomerAnalysis(approved);
  const netOpps = computeOpportunities(approved);
  return customers.map(c=>{
    const branches = c.branches.map(b=>{
      const issues = [];
      if(b.sos < 15) issues.push({type:'sos', text:`Low share of shelf — only ${fmt(b.sos)}% SOS. Worth negotiating more facings with the category buyer.`});
      if(b.sfr < 70) issues.push({type:'sfr', text:`Low shelf utilization — only ${fmt(b.sfr)}% SUC. Facing or replenishment gap.`});
      if(b.priceOkPct < 70) issues.push({type:'price', text:`Price compliance only ${fmt(b.priceOkPct)}% — audit shelf tags vs RSP.`});
      b.skuList.forEach(s=>{
        if(isFinite(s.coverageDays) && s.coverageDays>0 && s.coverageDays<3) issues.push({type:'lowstock', text:`${s.name} is critically low — ${fmt(s.coverageDays,1)} days of stock left (${fmt(s.stock)} units). Restock urgently.`});
        if(isFinite(s.coverageDays) && s.coverageDays>45) issues.push({type:'overstock', text:`${s.name} looks overstocked — ${fmt(s.coverageDays,1)} days of cover (${fmt(s.stock)} units). Consider pausing the next delivery or redistributing.`});
      });
      const key = c.name+' · '+b.branch;
      netOpps.filter(o=>o.branch===key).forEach(o=>{
        issues.push({type: o.type==='oos'?'oos':'underperform', text: `${o.sku} sells ${fmt(o.velocity,1)}/d here vs ${fmt(o.benchmark,1)}/d at ${o.benchmarkBranch} — potential to recover ~${fmt(o.gap,1)} units/day.`});
      });
      return { branch:b.branch, sfr:b.sfr, sos:b.sos, issues };
    }).filter(b=>b.issues.length>0);
    return { name:c.name, branches, totalIssues: branches.reduce((s,b)=>s+b.issues.length,0) };
  }).filter(c=>c.branches.length>0).sort((a,b)=>b.totalIssues-a.totalIssues);
}

}

/* ============================= LAZY VENDOR LIBRARY LOADING =============================
   PptxGenJS+JSZip, xlsx.js, and Leaflet used to be bundled directly into this HTML file — over
   1MB combined, downloaded and parsed on EVERY single page load whether or not that person ever
   exports a PPT/Excel file or opens Store Map. On a weak connection that alone can be the
   difference between the app loading and it timing out. They now live in their own files
   (vendor-pptxgen.js, vendor-xlsx.js, vendor-leaflet.js) next to this one in the repo, and are
   fetched only the first time they're actually needed, then cached by the browser/service worker
   for the rest of the session. */
const __vendorScriptPromises = {};
function loadScriptOnce(src){
  if(__vendorScriptPromises[src]) return __vendorScriptPromises[src];
  __vendorScriptPromises[src] = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = () => resolve();
    el.onerror = () => { delete __vendorScriptPromises[src]; reject(new Error(`Failed to load ${src} — check your connection and try again.`)); };
    document.head.appendChild(el);
  });
  return __vendorScriptPromises[src];
}

  if(window.PptxGenJS) return;
  await loadScriptOnce('./vendor-pptxgen.js');
  if(!window.PptxGenJS) throw new Error('PowerPoint library failed to initialize — try reloading the page.');
}

/* ============================= ROUTE CYCLE UPLOAD (accounts + merchandiser directory) =============================
   Parses the route cycle export (same columns as C3A's ERP route cycle report) and upserts it into the
   account list and a code→name merchandiser/supervisor directory. Matches existing accounts by
   CUSTOMER_NUMBER_LOCATION_ID first — that code is the one stable identifier for a specific branch/
   location, unlike the name text, which has shown up spelled differently across different uploads for
   the exact same store (e.g. "Seoudi" / "Seoudi Market" / "Super Market Seoudi") and used to fracture
   one real account into several duplicate entries. Falls back to name+branch matching only for
   accounts that don't have a code on file yet (first-time migration). Merch Head / Trade Marketing only. */
const ROUTE_CYCLE_COLUMNS = {
  custId: 'CUSTOMER_NUMBER_LOCATION_ID', name: 'Customer Name', branch: 'Customer_Address_ERP',
  channel: 'Channel', region: 'Region name', merchCode: 'Merchandiser code', merchName: 'Merchandiser Arabic name',
  supCode: 'Supervisor code', supName: 'Supervisor Arabic name', active: 'Merchandizer active', totalVisits: 'Total Visits',
};
async function handleRouteCycleFile(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  try{
    await loadXlsxLib();
    const buf = await file.arrayBuffer();
    const wb = window.XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = window.XLSX.utils.sheet_to_json(ws, { defval:'' });
    if(rows.length===0){ showToast('No rows found in that file'); return; }
    if(!(ROUTE_CYCLE_COLUMNS.name in rows[0]) || !(ROUTE_CYCLE_COLUMNS.merchCode in rows[0])){
      showToast("That file doesn't look like a route cycle export — expected columns like \"Customer Name\" and \"Merchandiser code\" weren't found.");
      return;
    }
    State.routeCycleRows = rows;
    const merchCodes = new Set(rows.map(r=>String(r[ROUTE_CYCLE_COLUMNS.merchCode]||'').trim()).filter(Boolean));
    let newAccounts = 0, updatedAccounts = 0;
    rows.forEach(row => {
      const name = String(row[ROUTE_CYCLE_COLUMNS.name]||'').trim();
      const branch = String(row[ROUTE_CYCLE_COLUMNS.branch]||'').trim();
      if(!name || !branch) return;
      const custId = row[ROUTE_CYCLE_COLUMNS.custId] != null ? String(row[ROUTE_CYCLE_COLUMNS.custId]).trim() : '';
      const matched = (custId && State.accounts.find(a => a.customerId && a.customerId===custId))
        || State.accounts.find(a => a.name.trim().toLowerCase()===name.toLowerCase() && a.branch.trim().toLowerCase()===branch.toLowerCase());
      if(matched) updatedAccounts++; else newAccounts++;
    });
    State.routeCyclePreview = { rowCount: rows.length, merchCount: merchCodes.size, newAccounts, updatedAccounts };
    render();
  }catch(e){
    console.error(e);
    showToast("Could not read that file — make sure it's a valid .xlsx export.");
  } finally {
    inputEl.value = '';
  }
}
function cancelRouteCycleUpload(){ State.routeCycleRows = null; State.routeCyclePreview = null; render(); }
async function applyRouteCycleUpload(){
  if(!State.routeCycleRows) return;
  if(!confirm(`Apply ${State.routeCycleRows.length} rows? This updates the account list and merchandiser directory — existing data for matched accounts will be overwritten with values from the file.`)) return;
  try{
    const directoryUpdates = {};
    State.routeCycleRows.forEach(row => {
      const name = String(row[ROUTE_CYCLE_COLUMNS.name]||'').trim();
      const branch = String(row[ROUTE_CYCLE_COLUMNS.branch]||'').trim();
      if(!name || !branch) return;
      const channel = String(row[ROUTE_CYCLE_COLUMNS.channel]||'').trim();
      const region = String(row[ROUTE_CYCLE_COLUMNS.region]||'').trim();
      const merchCode = String(row[ROUTE_CYCLE_COLUMNS.merchCode]||'').trim();
      const merchName = String(row[ROUTE_CYCLE_COLUMNS.merchName]||'').trim();
      const supCode = String(row[ROUTE_CYCLE_COLUMNS.supCode]||'').trim();
      const supName = String(row[ROUTE_CYCLE_COLUMNS.supName]||'').trim();
      const active = String(row[ROUTE_CYCLE_COLUMNS.active]||'').trim().toLowerCase() !== 'no';
      const custId = row[ROUTE_CYCLE_COLUMNS.custId] != null ? String(row[ROUTE_CYCLE_COLUMNS.custId]).trim() : '';
      const visitTargetRaw = row[ROUTE_CYCLE_COLUMNS.totalVisits];
      const visitTarget = visitTargetRaw!=null && visitTargetRaw!=='' && !isNaN(parseFloat(visitTargetRaw)) ? parseFloat(visitTargetRaw) : null;

      // Code first — the one stable identifier for this specific branch/location. Falls back to
      // name+branch only for an account that's never been tagged with a code before (first migration).
      let acct = custId ? State.accounts.find(a => a.customerId && a.customerId===custId) : null;
      if(!acct){
        acct = State.accounts.find(a => a.name.trim().toLowerCase()===name.toLowerCase() && a.branch.trim().toLowerCase()===branch.toLowerCase());
      }
      if(acct){
        // Name/branch text is overwritten every time (latest upload wins) — this is what lets a
        // previously-mislabeled account self-correct once matched by its stable code, instead of
        // permanently keeping whatever text happened to be typed in the very first upload.
        if(name) acct.name = name;
        if(branch) acct.branch = branch;
        if(channel) acct.channel = channel;
        if(region) acct.region = region;
        if(merchName) acct.merch = merchName;
        if(supName) acct.sup = supName;
        if(merchCode) acct.merchCode = merchCode;
        if(supCode) acct.supCode = supCode;
        if(custId) acct.customerId = custId;
        if(visitTarget!=null) acct.visitTarget = visitTarget;
      } else {
        State.accounts.push({ id:'acc_'+uid(), name, branch, channel, region, merch: merchName, sup: supName, merchCode, supCode, customerId: custId, target: 0, visitTarget: visitTarget||0 });
      }
      if(merchCode && merchName) directoryUpdates[merchCode] = { name: merchName, active };
      if(supCode && supName) directoryUpdates[supCode] = { name: supName, active: true };
    });
    await refSet('accounts', State.accounts, REF_DATA_VERSION);
    State.merchDirectory = { ...State.merchDirectory, ...directoryUpdates };
    await refSet('merchDirectory', State.merchDirectory, REF_DATA_VERSION);
    const preview = State.routeCyclePreview;
    showToast(`Applied ✓ — ${preview.newAccounts} new account${preview.newAccounts===1?'':'s'}, ${preview.updatedAccounts} updated, ${Object.keys(directoryUpdates).length} merchandiser/supervisor codes recorded.`);
    State.routeCycleRows = null; State.routeCyclePreview = null;
    render();
  }catch(e){
    console.error(e);
    showToast('Could not apply the file — check your connection and try again.');
  }
}
/* ---- Duplicate account cleanup — code-based grouping (reliable) plus a same-branch heuristic for
   accounts whose codes disagree or are missing on one side. The old version only cross-checked
   accounts that had NO code at all, so two accounts for the same physical branch — one carrying a
   customer code, the other blank, or carrying a different code from an earlier bad import — never
   got compared and slipped through as separate "customers" on the Dashboard. This compares every
   account's branch text regardless of whether a code is present, and flags the group whenever the
   codes disagree (including one side blank) or the name text disagrees — but only when the
   differing names still look like the same chain (share a non-generic word), so two genuinely
   different retailers that happen to have a store at the same mall (e.g. Carrefour and Spinneys
   both at City Stars) don't get grouped together just because the branch text matches. ---- */
const CHAIN_NAME_STOPWORDS = new Set(['سوبر','ماركت','هايبر','سوق','مول','ستور','ماركة','سنتر','market','super','hyper','mart']);
function chainNameCoreTokens(name){
  return new Set((name||'').trim().toLowerCase().split(/\s+/).filter(w=>w && !CHAIN_NAME_STOPWORDS.has(w)));
}
function findDuplicateAccountGroups(){
  const groups = [];
  const flaggedIds = new Set();
  // Pass 1: same customer code — always reliable regardless of name text.
  const byCode = {};
  State.accounts.forEach(a=>{ if(a.customerId){ (byCode[a.customerId] = byCode[a.customerId]||[]).push(a); } });
  Object.values(byCode).forEach(list=>{
    if(list.length>1){ groups.push({ reason:'Same customer code', accounts:list }); list.forEach(a=>flaggedIds.add(a.id)); }
  });
  // Pass 2: within each remaining same-branch-text bucket, cluster accounts by chain-name similarity
  // (union-find) rather than requiring the whole bucket to agree — a bucket can genuinely contain
  // several different retailers that share one mall/branch name (e.g. Carrefour and Spinneys both at
  // City Stars) alongside one real duplicate pair for a third chain, and each cluster needs judging
  // on its own. Two accounts link if they share a customer code, an exact name, or a non-generic
  // name word; singleton clusters (nothing else in the bucket looks like the same chain) are dropped.
  const byBranch = {};
  State.accounts.forEach(a=>{ if(flaggedIds.has(a.id)) return; const key = (a.branch||'').trim().toLowerCase(); if(key){ (byBranch[key] = byBranch[key]||[]).push(a); } });
  Object.values(byBranch).forEach(list=>{
    if(list.length<2) return;
    const parent = list.map((_,i)=>i);
    const find = i => { while(parent[i]!==i){ parent[i]=parent[parent[i]]; i=parent[i]; } return i; };
    const union = (i,j) => { const ri=find(i), rj=find(j); if(ri!==rj) parent[ri]=rj; };
    const tokenSets = list.map(a=>chainNameCoreTokens(a.name));
    const normNames = list.map(a=>a.name.trim().toLowerCase());
    for(let i=0;i<list.length;i++){
      for(let j=i+1;j<list.length;j++){
        const sameCode = list[i].customerId && list[j].customerId && list[i].customerId===list[j].customerId;
        const sameName = normNames[i]===normNames[j];
        const sharedToken = [...tokenSets[i]].some(t=>tokenSets[j].has(t));
        if(sameCode || sameName || sharedToken) union(i,j);
      }
    }
    const clusters = {};
    list.forEach((a,i)=>{ const r=find(i); (clusters[r]=clusters[r]||[]).push(a); });
    Object.values(clusters).forEach(cluster=>{
      if(cluster.length<2) return;
      const codes = new Set(cluster.map(a=>a.customerId||''));
      groups.push({ reason: codes.size>1 ? 'Same branch, different or missing customer code' : 'Same branch, different name spelling — no code on file to confirm', accounts:cluster });
    });
  });
  return groups;
}
function dupGroupSignature(ids){ return [...ids].sort().join('|'); }
function loadDismissedDupGroups(){
  try{ return new Set(JSON.parse(localStorage.getItem('shelfpulse_dup_dismissed')||'[]')); }catch(e){ return new Set(); }
}
function dismissDuplicateGroup(ids){
  const dismissed = loadDismissedDupGroups();
  dismissed.add(dupGroupSignature(ids));
  try{ localStorage.setItem('shelfpulse_dup_dismissed', JSON.stringify([...dismissed])); }catch(e){}
  showToast('Dismissed — won\'t show again unless the group changes');
  render();
}
function latestVisitTimeForAccount(accountId){
  let max = 0;
  State.visits.forEach(v=>{ if(v.accountId===accountId && (v.submittedAt||0)>max) max = v.submittedAt||0; });
  return max;
}
async function mergeAccountGroup(accountIds, keepId){
  const keepAcct = State.accounts.find(a=>a.id===keepId);
  if(!keepAcct){ showToast('Could not find the account to keep'); return; }
  const dupIds = accountIds.filter(id=>id!==keepId);
  if(dupIds.length===0){ showToast('Nothing selected to merge'); return; }
  showToast('Merging…');
  try{
    for(const oldId of dupIds){
      const affectedVisits = State.visits.filter(v=>v.accountId===oldId);
      for(const v of affectedVisits){
        try{ await visitUpdate(v.id, { accountId: keepId, accountName: keepAcct.name, branch: keepAcct.branch }); }catch(e){ console.error(e); }
      }
      const affectedDelegations = State.delegations.filter(d=>d.accountId===oldId);
      for(const d of affectedDelegations){
        try{
          await delegationCreate({ ...d, id: uid(), accountId: keepId, accountName: keepAcct.name, branch: keepAcct.branch });
          await delegationDelete(d.id);
        }catch(e){ console.error(e); }
      }
      try{
        const oldGallery = State.galleries[oldId];
        if(oldGallery && oldGallery.photos && oldGallery.photos.length){
          const keepPhotos = (State.galleries[keepId] && State.galleries[keepId].photos) || [];
          const merged = [...keepPhotos, ...oldGallery.photos].slice(0, GALLERY_MAX_PHOTOS);
          const { doc, setDoc, deleteDoc } = firestoreFns;
          await setDoc(doc(db,'galleries',keepId), { accountId:keepId, accountName:keepAcct.name, branch:keepAcct.branch, photos: merged });
          await deleteDoc(doc(db,'galleries',oldId));
        }
      }catch(e){ console.error(e); }
      State.accounts = State.accounts.filter(a=>a.id!==oldId);
    }
    await refSet('accounts', State.accounts, REF_DATA_VERSION);
    showToast('Merged ✓');
    render();
  }catch(e){
    console.error(e);
    showToast('Something went wrong partway through — check the account list before re-running.');
  }
}
function setDupKeep(sig, accountId){
  State.__dupKeep = State.__dupKeep || {};
  State.__dupKeep[sig] = accountId;
  render();
}
function toggleDupExclude(sig, accountId){
  State.__dupExclude = State.__dupExclude || {};

}
function startMergeConfirm(sig){

}
function cancelMergeConfirm(sig){

async function confirmMergeGroup(sig, allIds, keepId){

  const selectedIds = allIds.filter(id=>id===keepId || !excludeMap[id]);
  if(State.__dupConfirm) delete State.__dupConfirm[sig];

}
/* ---- Manual merge — full control for picking any set of accounts yourself, for the cases the
   automatic duplicate detection above doesn't catch (e.g. names/branches too different for it to
   link, but you know they're the same physical store). Search, add as many as you like, and the
   most-recently-visited one is suggested as the one to keep — override with the radio if needed. ---- */
function setManualMergeSearch(v){

function manualMergeResultsHtml(){

  if(matches.length===0) return `<p class="hint">No matching accounts</p>`;

      <span>${a.name} · ${a.branch}${a.customerId?' (code '+a.customerId+')':' (no code)'} — last visit ${lv?new Date(lv).toLocaleDateString():'none'}</span>
      <button class="btn btn-ghost btn-sm" onclick="manualMergeAdd('${a.id}')">+ Add</button>
    </div>`;
  }).join('');
}
function manualMergeAdd(accountId){
  State.__manualMergeSelected = State.__manualMergeSelected || [];
  if(!State.__manualMergeSelected.includes(accountId)) State.__manualMergeSelected.push(accountId);
  State.__manualMergeSearch = '';
  render();

function manualMergeRemove(accountId){
  State.__manualMergeSelected = (State.__manualMergeSelected||[]).filter(id=>id!==accountId);
  if(State.__manualMergeKeep===accountId) State.__manualMergeKeep = null;
  render();
}
function setManualMergeKeep(accountId){ State.__manualMergeKeep = accountId; render(); }
function startManualMergeConfirm(){ State.__manualMergeConfirm = true; render(); }
function cancelManualMergeConfirm(){ State.__manualMergeConfirm = false; render(); }
async function confirmManualMerge(){
  const selected = [...(State.__manualMergeSelected||[])];
  const keepId = State.__manualMergeKeep || [...selected].sort((a,b)=>latestVisitTimeForAccount(b)-latestVisitTimeForAccount(a))[0];
  State.__manualMergeConfirm = false;

async function addMerchandiserManually(){

/* ---- Scorecard ---- */
function screenScorecard(){
  const approved = State.visits.filter(v=>v.status==='approved');
  const mySet = State.role==='supervisor' ? new Set(myMerchandisers()) : null;
  const byMerch = {};
  approved.forEach(v=>{
    if(mySet && !mySet.has(v.auditor)) return;
    byMerch[v.auditor] = byMerch[v.auditor] || [];
    byMerch[v.auditor].push(v);
  });
  const rows = Object.entries(byMerch).map(([merch, visits])=>{
    const aggs = visits.map(visitAggregate);
    const avg = f => aggs.reduce((s,a)=>s+f(a),0)/aggs.length;
    const target = targetForMerch(merch);
    const achieved = achievedForMerch(merch);
    const branches = [...new Set(visits.map(v=>v.branch))];
    const a = { avgSfr: avg(x=>x.avgSfr), avgSos: avg(x=>x.avgSos), osaPct: avg(x=>x.osaPct), priceOkPct: avg(x=>x.priceOkPct), visitDonePct: avg(x=>x.visitDonePct), visitAchievedPct: target ? Math.min(100, achieved/target*100) : 100 };
    const durations = visits.map(visitDurationMinutes).filter(m=>m!==null);
    const avgDuration = durations.length ? durations.reduce((s,m)=>s+m,0)/durations.length : null;
    return { merch, sup: supervisorOfMerch(merch), visits: visits.length, branchCount: branches.length, target, achieved, score: scoreFor(a), avgDuration, ...a };
  }).sort((a,b)=>b.score-a.score);
  if(rows.length===0) return `<div class="screen"><h1>Scorecard / بطاقة الأداء</h1><p class="lede">Weighted score by merchandiser.</p>${emptyState('🏆','No approved visits yet','')}</div>`;
  return `<div class="screen">
    <h1>Scorecard / بطاقة الأداء</h1>
    <p class="lede">Weighted score by merchandiser — SUC 25% · OSA 15% · Price 20% · SOS 15% · Visit compliance 15% · Data completion 10%.</p>
    ${rows.map((r,idx)=>`
      <div class="card">
        <div class="visit-row" style="border:none;padding:0 0 8px">
          <div><div class="visit-main">#${idx+1} ${r.merch}</div><div class="hint">${r.sup?'Supervisor: '+r.sup+' · ':''}${r.branchCount} branch${r.branchCount>1?'es':''} · ${r.achieved}${r.target?'/'+r.target:''} visits</div></div>
          <div style="font-size:20px;font-weight:800;color:${barColor(r.score)}">${fmt(r.score)}%</div>
        </div>
        <div class="bar-track" style="margin-bottom:8px"><div class="bar-fill" style="width:${Math.min(100,r.score)}%;background:${barColor(r.score)}"></div></div>
        <div class="verify-row">
          ${statusChip('neutral','SUC '+fmt(r.avgSfr)+'%')}
          ${statusChip('neutral','SOS '+fmt(r.avgSos)+'%')}
          ${statusChip('neutral','OSA '+fmt(r.osaPct)+'%')}
          ${statusChip(r.priceOkPct>=80?'on':'watch','Price '+fmt(r.priceOkPct)+'%')}
          ${statusChip(r.visitDonePct>=95?'on':'watch','Data '+fmt(r.visitDonePct)+'%')}
          ${statusChip('neutral','⏱ '+fmtDuration(r.avgDuration))}
        </div>
      </div>`).join('')}
  </div>`;
}

/* ---- Delegate (one-off: hand a specific store, on a specific date, to another merchandiser — coverage gaps / unavailability.
   This never changes who owns the store — the original merchandiser keeps it in their route and target permanently.
   Whoever actually submits the visit gets the credit (auditor = the submitter), so this is purely about letting
   someone else's account show up in the delegate's account list for that one day. ---- */
function supervisorTeamAccounts(){
  if(State.role==='supervisor') return State.accounts.filter(a=>supervisorOfMerch(a.merch)===State.name);
  return State.accounts;
}
function delegateSearchInput(v){
  State.delegateSearch = v;
  const el = document.getElementById('delegate-list');
  if(el) el.innerHTML = delegateListHtml();
}
function delegateToggle(id){
  if(State.delegateSelected.has(id)) State.delegateSelected.delete(id); else State.delegateSelected.add(id);
  render();
}
function delegateSetTarget(v){ State.delegateTarget = v; }
function delegateSetDate(v){ State.delegateDate = v; render(); }
function delegationsForAccountDate(accountId, date){
  return State.delegations.filter(x=>x.accountId===accountId && x.date===date);
}
async function delegateApply(){
  if(!['supervisor','merch_head','trade_marketing'].includes(State.role)){ showToast('Not authorized'); return; }
  if(!State.delegateTarget){ showToast('Choose a merchandiser to delegate to first'); return; }
  if(!State.delegateDate){ showToast('Choose a date first'); return; }
  const ids = [...State.delegateSelected];
  if(!ids.length){ showToast('Select at least one store to delegate'); return; }
  const accounts = ids.map(id=>State.accounts.find(a=>a.id===id)).filter(Boolean);
  // State.delegateTarget is "code:5662" when the target has a known merchandiser code (preferred —
  // matches reliably on their device regardless of which name-string variant this dropdown shows),
  // or "name:Ahmed…" for someone without a code yet, matched the old way as a fallback.
  const isCode = State.delegateTarget.startsWith('code:');
  const toMerchCode = isCode ? State.delegateTarget.slice(5) : null;
  const toMerchName = isCode
    ? ((State.merchDirectory && State.merchDirectory[toMerchCode] && State.merchDirectory[toMerchCode].name) || toMerchCode)
    : State.delegateTarget.slice(5);
  if(!confirm(`Delegate ${accounts.length} store(s) to ${toMerchName} for ${State.delegateDate} only? The store${accounts.length>1?'s':''} stay${accounts.length>1?'':'s'} on the original merchandiser's route afterwards, and credit goes to whoever actually submits the visit.`)) return;
  showToast('Delegating…');
  try{
    for(const a of accounts){
      // Replace any existing delegation for this store+date rather than stacking duplicates.
      for(const existing of delegationsForAccountDate(a.id, State.delegateDate)){ await delegationDelete(existing.id); }
      await delegationCreate({
        id: uid(), accountId: a.id, accountName: a.name, branch: a.branch,
        date: State.delegateDate, toMerch: toMerchName, toMerchCode, fromMerch: (a.merch||'').trim(), fromMerchCode: a.merchCode||null,
        createdBy: identityLabel(), createdAt: Date.now(),
      });
    }
  }catch(e){ console.error(e); showToast('Failed to save — try again'); return; }
  State.delegateSelected = new Set();
  showToast('Delegated ✓');
  render();
}
async function cancelDelegation(id){
  if(!confirm('Cancel this delegation?')) return;
  try{ await delegationDelete(id); showToast('Cancelled ✓'); }
  catch(e){ console.error(e); showToast('Failed to cancel — try again'); }
}
function delegateListHtml(){
  const q = (State.delegateSearch||'').toLowerCase();

function screenDelegate(){
  // Grouped by merchandiser code where the account has one, so the same real person — who might have
  // slightly inconsistent name spelling across different imported account rows — only ever appears
  // once here, and delegating to them reaches their device reliably (matched by code, not by

  const byCode = {};

  State.accounts.forEach(a=>{

      if(!byCode[a.merchCode]) byCode[a.merchCode] = (State.merchDirectory && State.merchDirectory[a.merchCode] && State.merchDirectory[a.merchCode].name) || (a.merch||'').trim() || a.merchCode;
    } else if(a.merch && a.merch.trim()) plainNames.add(a.merch.trim());

  const merchOptions = [
    ...Object.entries(byCode).map(([code,name])=>({value:'code:'+code, label:`${name} (${code})`})),

      <label style="margin-top:10px">${bi('Delegate selected stores to','نقل الزيارات المحددة الى')}</label>
      <select onchange="delegateSetTarget(this.value)">
        <option value="">— ${bi('Choose merchandiser','اختر المندوب')} —</option>
        ${merchOptions.map(m=>`<option value="${m.value.replace(/"/g,'&quot;')}" ${State.delegateTarget===m.value?'selected':''}>${m.label}</option>`).join('')}
      </select>
      <button class="btn btn-primary" style="margin-top:10px;width:100%" onclick="delegateApply()">${bi('Delegate selected stores','نقل المتاجر المحددة')} (${State.delegateSelected.size})</button>
    </div>
    <input type="text" placeholder="Search store, branch, or merchandiser…" value="${State.delegateSearch||''}" oninput="delegateSearchInput(this.value)" style="margin:12px 0"/>
    <div id="delegate-list">${delegateListHtml()}</div>

/* ---- Edit Visit ---- */
function screenEditVisit(){
  const visit = State.visits.find(v=>v.id===State.editingVisitId);
  if(!visit || !State.editDraft){ return `<div class="screen">${emptyState('⚠️','Visit not found','It may have been deleted.')}<button class="btn btn-ghost" onclick="cancelVisitEdit()">Back</button></div>`; }
  const d = State.editDraft;
  const catTotal = parseFloat(d.catFacingsTotal) || 0;
  const spaceTotal = parseFloat(d.shahdSpaceTotal) || 0;
  const filledTotal = d.items.reduce((s,it)=>s+(parseFloat(it.actualCapacity)||0),0);
  const shahdFacingsSum = d.items.reduce((s,it)=>{
    const sku = SKU_MAP[it.skuId];
    if(sku && sku.category==='Marinated Fresh') return s;
    return s + (parseFloat(it.shahdFacings)||0);
  }, 0);
  const sosOverall = catTotal>0 ? (shahdFacingsSum/catTotal*100) : 0;
  const fillPct = spaceTotal>0 ? Math.min(300,(filledTotal/spaceTotal*100)) : 0;
  const exceeds = catTotal>0 && shahdFacingsSum>catTotal;
  return `<div class="screen">
    <h1>Editing visit / تعديل الزيارة</h1>
    <p class="lede">${visit.accountName} · ${visit.branch} · ${visit.date} · submitted by ${visit.auditor}</p>
    <div class="card" style="background:var(--amber-tint);border-color:var(--amber)">
      <p class="hint" style="color:var(--amber);margin:0">Changes save immediately to this existing visit — this does not create a new submission or affect approval status.</p>
    </div>
    <div class="card" style="border-color:var(--red)">
      <h3 style="color:var(--red)">Visit-level totals — where most SUC/SOS errors actually are</h3>
      <p class="hint" style="margin:0 0 10px">These two numbers are entered once for the whole visit and drive every SUC%/SOS% calculation — they're not per-SKU. If a visit's SUC or SOS looks inflated, this is almost always where the real mistake is, not in an individual SKU's line below.</p>
      <div><label>Category facings (total) / إجمالي واجهات الفئة</label><input type="number" inputmode="decimal" value="${d.catFacingsTotal}" oninput="editDraftSetCatFacingsTotal(this.value)" onblur="editDraftTotalsBlur()"/></div>
      <div style="margin-top:10px"><label>Full Shahd space total (dedicated) / إجمالي مساحة شهد المخصصة</label><input type="number" inputmode="decimal" value="${d.shahdSpaceTotal}" oninput="editDraftSetShahdSpaceTotal(this.value)" onblur="editDraftTotalsBlur()"/></div>
      <div class="verify-row" style="margin-top:10px">
        ${catTotal>0 ? statusChip(sosOverall>SOS_MONITOR_MAX?'off':'on', `SOS / حصة الرف: ${fmt(sosOverall)}%`) : statusChip('neutral','Enter category total to see SOS')}
        ${spaceTotal>0 ? statusChip(fillPct>SUC_MONITOR_MAX?'off':'on', `SUC / التعبئة: ${fmt(fillPct)}%`) : statusChip('neutral','Enter dedicated space total to see SUC')}
      </div>
      ${exceeds ? `<p class="hint" style="color:var(--red);font-weight:700;margin:8px 0 0">⚠️ Total Shahd facings (${fmt(shahdFacingsSum)}) exceed total category facings (${fmt(catTotal)}) — recheck the count, or confirm "extra display" below if Shahd genuinely has space beyond the main category shelf.</p>
      <label style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <input type="checkbox" ${d.extraDisplay?'checked':''} onchange="editDraftSetExtraDisplay(this.checked)"/>

    </div>

    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-ghost" style="flex:1" onclick="cancelVisitEdit()">Cancel</button>

    </div>
  </div>`;
}

        <div><label>Shahd facings (this SKU) / واجهات شهد لهذا المنتج</label><input type="number" inputmode="decimal" value="${it.shahdFacings}" oninput="editLineField(${idx},'shahdFacings',this.value)" onblur="editLineFieldBlur()"/></div>

      </div>
    </div>` : ''}
  </div>`;
}

async function initStoreMap(){
  if(storeMapInstance){ try{ storeMapInstance.remove(); }catch(e){} storeMapInstance = null; }
  const container = document.getElementById('store-map-container');
  const entries = Object.entries(State.locations);
  if(!container || entries.length===0) return;
  if(typeof L === 'undefined'){
    container.innerHTML = '<p class="hint" style="padding:20px">Loading map…</p>';
    try{
      await loadScriptOnce('./vendor-leaflet.js');
    }catch(e){
      container.innerHTML = '<p class="hint" style="padding:20px;color:var(--red)">Map failed to load — check your connection and try again.</p>';
      return;
    }
    if(typeof L === 'undefined'){
      container.innerHTML = '<p class="hint" style="padding:20px;color:var(--red)">Map library failed to initialize — try reloading the page.</p>';
      return;
    }
    container.innerHTML = ''; // clear the "Loading map…" placeholder now that Leaflet is ready to take over
  }
  const avgLat = entries.reduce((s,[,v])=>s+v.lat,0)/entries.length;
  const avgLng = entries.reduce((s,[,v])=>s+v.lng,0)/entries.length;
  storeMapInstance = L.map(container).setView([avgLat, avgLng], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
  }).addTo(storeMapInstance);
  entries.forEach(([accountId, loc])=>{
    const safeId = accountId.replace(/'/g,"\\'");
    const safeBranch = (loc.branch||'').replace(/'/g,"\\'");
    L.circleMarker([loc.lat, loc.lng], { radius:11, color:'#C0272D', weight:2.5, fillColor:'#C0272D', fillOpacity:0.75 })
      .addTo(storeMapInstance)
      .bindPopup(`<b>${loc.accountName||''}</b><br>${loc.branch||''}${loc.accuracy?`<br><span style="color:#6B615E;font-size:11px">±${Math.round(loc.accuracy)}m accuracy</span>`:''}<br><button onclick="openBranchDetail('${safeId}','${safeBranch}')" style="margin-top:6px;background:#C0272D;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer">View details →</button>`);
  });
  setTimeout(()=>{ if(storeMapInstance) storeMapInstance.invalidateSize(); }, 150);
}

function openBranchDetail(accountId, branch){
  State.selectedBranchAccountId = accountId;
  State.selectedBranchName = branch;
  State.tab = 'branchdetail';
  render();
}
function screenBranchDetail(){
  const loc = State.locations[State.selectedBranchAccountId];
  if(!loc) return `<div class="screen">${emptyState('⚠️','Branch not found','')}<button class="btn btn-ghost" onclick="go('storemap')">Back to map</button></div>`;
  const approved = State.visits.filter(v=>v.status==='approved');
  const customers = computeCustomerAnalysis(approved);
  // Matched by which account fed into a branch bucket, not by name/branch text — those get
  // canonicalized and can end up showing a different account's label once a later visit from a
  // duplicate-account branch becomes the "latest" one, so text matching here would silently miss it.
  let customerRow = null, branchRow = null;
  for(const cust of customers){
    const found = cust.branches.find(b=>b.accountIds && b.accountIds.includes(State.selectedBranchAccountId));
    if(found){ customerRow = cust; branchRow = found; break; }
  }
  const photos = [];
  approved.forEach(v=>{ if(v.accountId===State.selectedBranchAccountId && v.branch===loc.branch) visitPhotos(v).forEach(p=>photos.push({photo:p, date:v.date})); });

  return `<div class="screen">
    <button class="btn btn-ghost btn-sm" style="margin-bottom:10px" onclick="go('storemap')">← Back to map</button>
    <h1>${loc.accountName}</h1>
    <p class="lede">${loc.branch}${loc.accuracy?` · located to within ±${Math.round(loc.accuracy)}m`:''}${branchRow && branchRow.lastVisitDate?` · Last visited: ${branchRow.lastVisitDate}`:''}</p>
    ${!branchRow ? emptyState('📊','No approved visit data yet','This branch is located on the map, but has no approved visits to show performance data from yet.') : `
      <div class="kpi-grid">
        <div class="kpi accent"><div class="num">${fmt(branchRow.sfr)}%</div><div class="lbl">SUC</div></div>
        <div class="kpi"><div class="num">${fmt(branchRow.sos)}%</div><div class="lbl">SOS</div></div>
        <div class="kpi"><div class="num">${fmt(branchRow.osaPct)}%</div><div class="lbl">OSA</div></div>
        <div class="kpi"><div class="num">${fmt(branchRow.priceOkPct)}%</div><div class="lbl">Price OK</div></div>
      </div>
      <div class="verify-row" style="margin:10px 0">
        ${statusChip('neutral', `Dedicated Shahd space: ${fmt(branchRow.shahdSpaceTotal)}`)}
        ${statusChip('neutral', `Category facings: ${fmt(branchRow.catFacingsTotal)}`)}
        ${statusChip('neutral', `Shahd facings: ${fmt(branchRow.shahdFacingsTotal)}`)}
        ${branchRow.shahdFacingsTotal>branchRow.catFacingsTotal ? statusChip(branchRow.extraDisplay?'watch':'off', branchRow.extraDisplay?'⚠️ Extra display beyond category shelf confirmed':'⚠️ Exceeds category facings — needs review') : ''}
      </div>
      <div class="card">
        <h3>By SKU — price, stock &amp; coverage</h3>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px"><table class="mini"><tr><th>SKU</th><th>Actual</th><th>RSP</th><th>Status</th><th>Vel/d</th><th>Stock (units)</th><th>Filled (units)</th><th>Facings</th><th>Util vs total%</th><th>SOS vs Shahd%</th><th>SOS vs category%</th><th>Days cover</th></tr>
          ${branchRow.skuList.map(s=>{ const excl = s.category==='Marinated Fresh'; return `<tr><td>${s.name}</td><td>${s.actualPrice>0?fmt(s.actualPrice)+' EGP':'—'}</td><td>${s.rsp?fmt(s.rsp)+' EGP':'—'}</td><td>${s.actualPrice>0?statusChip(s.priceStatus, s.priceStatus==='on'?'Matching':s.priceStatus==='watch'?'Above':s.priceStatus==='off'?'Below':'—'):'—'}</td><td>${s.avgVel>0?fmt(s.avgVel,1):'—'}</td><td>${fmt(s.stock)}</td><td>${fmt(s.capacity)}</td><td>${fmt(s.shahdFacings)}</td><td>${excl?'—':fmt(s.sfr)+'%'}</td><td>${excl?'—':fmt(s.sosVsShahd)+'%'}</td><td>${excl?'—':fmt(s.sos)+'%'}</td><td>${fmtCoverage(s.coverageDays)}</td></tr>`; }).join('')}
        </table></div>
      </div>
    `}
    ${photos.length ? `<div class="card"><h3>Captured photos</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${photos.map(p=>`<img src="${p.photo}" title="${p.date}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="window.open('${p.photo}')"/>`).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

function setMergeBrowseIdx(i){ State.__mergeBrowseIdx = i; render(); }
function manageBackendMergingHtml(){
  const customerNames = [...new Set(State.accounts.map(a=>canonicalCustomerName(a.name)))].sort((a,b)=>a.localeCompare(b));
  const browseIdx = State.__mergeBrowseIdx;
  const browseName = (browseIdx!=null) ? customerNames[browseIdx] : null;
  return `
    <div class="card" style="border-color:var(--amber)">
      <h3 style="color:var(--amber)">Duplicate accounts</h3>
      ${(() => {
        const dismissed = loadDismissedDupGroups();
        const groups = findDuplicateAccountGroups().filter(g=>!dismissed.has(dupGroupSignature(g.accounts.map(a=>a.id))));
        if(groups.length===0) return `<p class="hint">No duplicate accounts detected right now.</p>`;
        return `
        <p class="hint" style="margin-bottom:10px">${groups.length} likely duplicate group${groups.length===1?'':'s'} found — same customer code, or same branch with a similar name (e.g. "Seoudi" vs "Seoudi Market"). Pick which one to keep — its name/branch and last-visit date become the merged record's. Untick anyone in the list who doesn't actually belong (e.g. a different chain that happens to share a mall), then merge just the rest. If the whole group is wrong, dismiss it instead.</p>
        ${groups.map((g)=>{
          const ids = g.accounts.map(a=>a.id);
          const sig = dupGroupSignature(ids);
          const suggested = [...g.accounts].sort((a,b)=>latestVisitTimeForAccount(b.id)-latestVisitTimeForAccount(a.id))[0];
          const keepId = (State.__dupKeep && State.__dupKeep[sig]) || suggested.id;
          const excludeMap = (State.__dupExclude && State.__dupExclude[sig]) || {};
          const selectedCount = g.accounts.filter(a=>a.id!==keepId && !excludeMap[a.id]).length;
          const keepAcct = State.accounts.find(a=>a.id===keepId);
          const confirming = State.__dupConfirm && State.__dupConfirm[sig];
          return `<div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px">
            <p class="hint" style="margin-bottom:6px">${g.reason}</p>
            ${g.accounts.map(a=>{
              const isKeep = a.id===keepId;
              const lastVisit = latestVisitTimeForAccount(a.id);
              const lastVisitLabel = lastVisit ? new Date(lastVisit).toLocaleDateString() : 'none';
              const infoText = `${a.name} · ${a.branch}${a.customerId?' (code '+a.customerId+')':' (no code)'} — last visit ${lastVisitLabel}`;
              return isKeep
                ? `<label style="display:flex;align-items:center;gap:8px;padding:4px 0">
                    <input type="radio" name="dupkeep_${sig}" checked onchange="setDupKeep('${sig}','${a.id}')"/>
                    <span style="font-weight:600">${infoText} — keeping this one</span>
                  </label>`
                : `<div style="display:flex;align-items:center;gap:8px;padding:4px 0">
                    <input type="radio" name="dupkeep_${sig}" onchange="setDupKeep('${sig}','${a.id}')"/>
                    <input type="checkbox" ${excludeMap[a.id]?'':'checked'} onchange="toggleDupExclude('${sig}','${a.id}')"/>
                    <span${excludeMap[a.id]?' style="color:var(--soft)"':''}>${infoText}${excludeMap[a.id]?' — excluded, won\'t be touched':''}</span>
                  </div>`;
            }).join('')}
            ${confirming ? `
              <div style="margin-top:8px;padding:8px;background:#FBF3E4;border-radius:6px">
                <p class="hint" style="margin-bottom:6px">Merge ${selectedCount} account(s) into "${keepAcct?keepAcct.name:''} · ${keepAcct?keepAcct.branch:''}"? Visits, delegations, and gallery photos move over. This can't be undone.</p>
                <div style="display:flex;gap:8px">
                  <button class="btn btn-danger btn-sm" onclick="confirmMergeGroup('${sig}', ${JSON.stringify(ids).replace(/"/g,'&quot;')}, '${keepId}')">Yes, merge ${selectedCount}</button>
                  <button class="btn btn-ghost btn-sm" onclick="cancelMergeConfirm('${sig}')">Cancel</button>
                </div>
              </div>
            ` : `
              <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
                <button class="btn btn-danger btn-sm" ${selectedCount===0?'disabled':''} onclick="startMergeConfirm('${sig}')">Merge selected (${selectedCount})</button>

function daysAgoLabel(dateStr){
  if(!dateStr) return '';
  const days = Math.round((new Date(todayStr()) - new Date(dateStr)) / 86400000);
  if(days <= 0) return ' (today)';
  if(days === 1) return ' (1d ago)';
  return ` (${days}d ago)`;
}
function daysSinceLastVisitFor(accountId){
  // Auto-computed from real visit history now that every visit is dated the day it happened (see the
  // "always today" lock) — no reason to make merchandisers guess/type this by hand anymore.
  const prior = State.visits
    .filter(v => v.accountId===accountId && v.status!=='rejected' && v.date < todayStr())
    .sort((a,b) => (b.submittedAt||0)-(a.submittedAt||0))[0];
  if(!prior) return 7; // no prior visit on record — neutral fallback rather than 0, which would understate velocity
  const days = Math.round((new Date(todayStr()) - new Date(prior.date)) / 86400000);
  return days > 0 ? days : 1; // guard against a same-day repeat visit skewing the velocity denominator toward zero
}
function pickAccount(id){
  const a = State.accounts.find(a=>a.id===id); if(!a) return;
  const dft = State.draft;
  dft.accountId = a.id; dft.accountName = a.name; dft.branch = a.branch; dft.channel = a.channel; dft.region = a.region;
  if(dft.items.length === 0){
    const daysSince = daysSinceLastVisitFor(a.id);
    dft.items = State.skus.map(s => {
      return {skuId:s.id, opening:'', closing:'', deliveries:'', actualCapacity:'', catFacings:'', shahdFacings:'', actualPrice:'', days:String(daysSince), _open:false};
    });
  }
  saveDraftLocal();
  render();
}
function clearAccount(){
  // Changing accounts abandons any in-progress arrival at the old one — best-effort, fire-and-forget
  // so a slow connection doesn't block the merchandiser from moving on.
  if(State.draft.arrivalId){ arrivalUpdate(State.draft.arrivalId, {status:'abandoned'}).catch(()=>{}); }
  State.draft.accountId=''; State.draft.accountName=''; State.draft.branch=''; State.draft.items=[]; State.draft.catFacingsTotal=''; State.draft.shahdSpaceTotal=''; State.draft.extraDisplay=false; State.draft.photos=[]; State.draft.geo=null; State.draft.capturedAt=null; State.draft.arrivalId=null; State.draft.arrivedAt=null; State.accountSearch=''; clearDraftLocal(); render();
}

}

  if(!State.role){ app.innerHTML = screenLogin(); return; }

  const conf = roleConf();
  let body = '';
  try{
    if(State.tab==='newvisit') body = screenNewVisit();
    else if(State.tab==='myvisits') body = screenMyVisits();
    else if(State.tab==='approvals') body = screenApprovals();
    else if(State.tab==='arrivals') body = screenArrivals();
    else if(State.tab==='visitcalendar') body = screenVisitCalendar();
    else if(State.tab==='accounts') body = screenAccounts();
    else if(State.tab==='dashboard') body = screenDashboard();

    </div>
    ${body}

    ${State.toast ? `<div class="toast">${State.toast}</div>` : ''}
    ${State.cameraOpen ? cameraOverlayHtml() : ''}
