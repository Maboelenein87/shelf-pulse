<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Shelf Pulse — Cairo 3A</title>
<style>
  :root{
    --red:#C0272D; --red-dark:#8E1116; --red-tint:#FBEAEA;
    --ink:#201B1A; --ink-soft:#6B615E;
    --bg:#F6F2EF; --card:#FFFFFF; --line:#E9E1DD;
    --green:#1E7145; --green-tint:#E7F3EC;
    --amber:#9C6B08; --amber-tint:#FBF1DD;
    --danger-tint:#FBEAEA;
    --radius:14px;
    --shadow:0 1px 2px rgba(32,27,26,.06), 0 6px 20px -8px rgba(32,27,26,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:78px;}
  .app{max-width:520px;margin:0 auto;position:relative;}
  .topbar{background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 100%);color:#fff;padding:16px 18px 20px;border-radius:0 0 20px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .topbar::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08);}
  .topbar-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:-.5px;}
  .brand-name{font-size:16px;font-weight:700;letter-spacing:.2px;}
  .brand-sub{font-size:11px;opacity:.85;margin-top:1px;}
  .role-pill{display:flex;background:rgba(255,255,255,.16);border-radius:20px;padding:3px;gap:2px;}
  .role-pill button{border:none;background:transparent;color:#fff;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:16px;opacity:.7;cursor:pointer;}
  .role-pill button.active{background:#fff;color:var(--red-dark);opacity:1;}
  .who-row{margin-top:14px;position:relative;z-index:1;}
  .who-input{width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:9px 12px;font-size:13px;}
  .who-input::placeholder{color:rgba(255,255,255,.75);}
  .screen{padding:16px 16px 8px;}
  .screen h1{font-size:18px;margin:2px 0 3px;letter-spacing:-.2px;}
  .screen .lede{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .card h3{font-size:13px;margin:0 0 10px;color:var(--ink);font-weight:700;}
  label{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.3px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1.5px solid var(--line);background:#FDFCFB;border-radius:9px;padding:10px 11px;font-size:14.5px;color:var(--ink);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .hint{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:active{background:var(--red-dark);}
  .btn-ghost{background:transparent;color:var(--red);border:1.5px solid var(--red);}
  .btn-line{background:var(--card);color:var(--ink);border:1.5px dashed var(--line);}
  .btn-sm{padding:8px 12px;font-size:12.5px;width:auto;border-radius:9px;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-danger{background:var(--red);color:#fff;}
  .sku-line{border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .sku-line-head{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:#FBF9F8;cursor:pointer;}
  .sku-line-title{font-size:13.5px;font-weight:700;}
  .sku-line-meta{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .sku-line-body{padding:12px;border-top:1px solid var(--line);}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .chip.on{background:var(--green-tint);color:var(--green);}
  .chip.watch{background:var(--amber-tint);color:var(--amber);}
  .chip.off{background:var(--danger-tint);color:var(--red);}
  .chip.neutral{background:#EFEBE9;color:var(--ink-soft);}
  .remove-x{background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:2px 6px;}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);}
  .kpi .num{font-size:22px;font-weight:800;letter-spacing:-.5px;}
  .kpi .lbl{font-size:10.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:2px;}
  .kpi.accent .num{color:var(--red);}
  .gauge-wrap{display:flex;align-items:center;gap:14px;}
  .gauge-num{font-size:24px;font-weight:800;}
  .gauge-lbl{font-size:11px;color:var(--ink-soft);}
  .visit-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
  .visit-row:last-child{border-bottom:none;}
  .visit-main{font-size:13.5px;font-weight:700;}
  .visit-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .status-badge{font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
  .status-pending{background:var(--amber-tint);color:var(--amber);}
  .status-approved{background:var(--green-tint);color:var(--green);}
  .status-rejected{background:var(--danger-tint);color:var(--red);}
  table.mini{width:100%;border-collapse:collapse;font-size:12px;}
  table.mini th{text-align:left;font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;padding:6px 6px;border-bottom:1.5px solid var(--line);}
  table.mini td{padding:8px 6px;border-bottom:1px solid var(--line);}
  table.mini tr:last-child td{border-bottom:none;}
  .bar-track{background:#EFEBE9;border-radius:6px;height:7px;width:100%;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .empty{text-align:center;padding:34px 16px;color:var(--ink-soft);}
  .empty .big{font-size:30px;margin-bottom:8px;}
  .empty p{font-size:12.5px;margin:2px 0;}
  .navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -4px 16px rgba(0,0,0,.06);z-index:20;}
  .navbtn{flex:1;border:none;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);cursor:pointer;}
  .navbtn.active{color:var(--red);}
  .navbtn .ico{font-size:18px;line-height:1;}
  .navbtn .lbl{font-size:9.5px;font-weight:700;}
  .badge-dot{position:absolute;top:2px;right:18%;background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .navbtn-wrap{position:relative;flex:1;display:flex;}
  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;max-width:88%;text-align:center;}
  .loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}
  .sectitle{font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px 2px;}
  .sectitle:first-child{margin-top:0;}
  .pillrow{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
  .pillrow button{flex-shrink:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer;}
  .pillrow button.active{background:var(--red);border-color:var(--red);color:#fff;}
  .search-result{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .search-result:last-child{border-bottom:none;}
  .search-result:active{background:#FBF9F8;}
  .sr-main{font-size:13px;font-weight:700;}
  .sr-sub{font-size:11px;color:var(--ink-soft);}
  .photo-box{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;}
  .photo-preview{width:100%;border-radius:10px;margin-bottom:8px;max-height:180px;object-fit:cover;}
  .verify-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .branch-toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;border-top:1px solid var(--line);}
  .branch-toggle:first-child{border-top:none;}
</style>
</head>

if(isConfigured){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  firestoreFns = fs;
  app = initializeApp(firebaseConfig);
  db = fs.getFirestore(app);
} else {
  document.getElementById('setup-screen').style.display = 'block';
  document.getElementById('app').style.display = 'none';
}

/* ============================= STORAGE HELPERS (Firestore) ============================= */
const REF_DATA_VERSION = 2; // bump this whenever DEFAULT_SKUS/DEFAULT_ACCOUNTS change, to force a refresh
async function refGet(name){
  if(!isConfigured) return null;
  const { doc, getDoc } = firestoreFns;
  const snap = await getDoc(doc(db, 'meta', name));
  return snap.exists() ? snap.data() : null;
}
async function refSet(name, list, version){
  if(!isConfigured) return;
  const { doc, setDoc } = firestoreFns;
  await setDoc(doc(db, 'meta', name), { list, version });
}
function watchVisits(){
  if(!isConfigured) return;
  const { collection, onSnapshot, query, orderBy } = firestoreFns;
  const q = query(collection(db, 'visits'), orderBy('submittedAt', 'desc'));
  onSnapshot(q, snap => {
    const visits = [];
    snap.forEach(d => visits.push({ id: d.id, ...d.data() }));
    State.visits = visits;
    render();
  });
}
async function visitCreate(visit){
  const { doc, setDoc } = firestoreFns;
  await setDoc(doc(db, 'visits', visit.id), visit);
}
async function visitUpdate(id, patch){
  const { doc, updateDoc } = firestoreFns;
  await updateDoc(doc(db, 'visits', id), patch);
}

let SKU_MAP = {};

/* ============================= CALC ENGINE ============================= */
const REQUIRED_ITEM_FIELDS = ['opening','deliveries','closing','pogFacings','actualCapacity','catFacings','shahdFacings','actualPrice'];
function isItemComplete(it){
  return REQUIRED_ITEM_FIELDS.every(f => it[f] !== '' && it[f] !== undefined && it[f] !== null);
}
function computeItem(it){
  const n = v => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
  const opening = n(it.opening), closing = n(it.closing), deliveries = n(it.deliveries);
  const pog = n(it.pogFacings), cap = n(it.actualCapacity), catF = n(it.catFacings), shahdF = n(it.shahdFacings);
  const price = n(it.actualPrice), days = n(it.days) || 1;
  const sku = SKU_MAP[it.skuId] || {};

  const unitsSold = Math.max(0, opening + deliveries - closing);
  const velocity = unitsSold / days;
  const actualShelfStock = closing;
  const stockCoverage = velocity > 0 ? actualShelfStock / velocity : (actualShelfStock > 0 ? Infinity : 0);
  const sfr = pog > 0 ? Math.min(150, (cap / pog) * 100) : 0;
  const sos = catF > 0 ? Math.min(100, (shahdF / catF) * 100) : 0;
  const osa = cap > 0 ? 'Y' : 'N';

  const rsp = sku.rsp || 0;
  let priceStatus = 'neutral', priceLbl='—', priceDiffPct = 0;
  if(rsp > 0 && price > 0){
    priceDiffPct = ((price - rsp) / rsp) * 100;
    if(Math.abs(priceDiffPct) <= 2){ priceStatus='on'; priceLbl='Matching RSP'; }
    else if(priceDiffPct > 2){ priceStatus='watch'; priceLbl='Above RSP'; }
    else { priceStatus='off'; priceLbl='Below RSP'; }
  }
  const visitDone = isItemComplete(it);

  return {unitsSold, velocity, actualShelfStock, stockCoverage, sfr, sos, osa, priceStatus, priceLbl, priceDiffPct, visitDone};
}

function visitAggregate(visit){
  const items = (visit.items||[]).map(it => ({...it, calc: computeItem(it)}));
  const n = items.length || 1;
  const avg = f => items.reduce((s,it)=>s+f(it.calc),0) / n;
  const finiteCoverage = items.map(it=>it.calc.stockCoverage).filter(x=>isFinite(x));
  return {
    items,
    avgSfr: avg(c=>c.sfr),
    avgSos: avg(c=>c.sos),
    osaPct: items.filter(it=>it.calc.osa==='Y').length / n * 100,
    priceOkPct: items.filter(it=>it.calc.priceStatus==='on').length / n * 100,
    visitDonePct: items.filter(it=>it.calc.visitDone).length / n * 100,
    totalUnits: items.reduce((s,it)=>s+it.calc.unitsSold,0),
    avgVelocity: avg(c=>c.velocity),
    avgCoverage: finiteCoverage.length ? finiteCoverage.reduce((a,b)=>a+b,0)/finiteCoverage.length : 0,
    hasPhoto: !!visit.photo,
    hasGeo: !!visit.geo,
  };
}

function scoreFor(a){
  const clamp = x => Math.max(0, Math.min(100, x||0));
  return clamp(a.avgSfr)*0.25 + clamp(a.osaPct)*0.15 + clamp(a.priceOkPct)*0.20 + clamp(a.avgSos)*0.15 + clamp(a.visitAchievedPct)*0.15 + clamp(a.visitDonePct)*0.10;
}

/* ============================= DATA LOAD/SAVE ============================= */
async function loadAll(){
  if(!isConfigured){ State.loaded = true; return; }
  const me = localStorage.getItem('shelfpulse_me');
  if(me){ try{ const p = JSON.parse(me); State.role = p.role || 'merchandiser'; State.name = p.name || ''; }catch(e){} }

  const skusDoc = await refGet('skus');
  if(!skusDoc || skusDoc.version !== REF_DATA_VERSION){
    await refSet('skus', DEFAULT_SKUS, REF_DATA_VERSION);
    State.skus = DEFAULT_SKUS;
  } else {
    State.skus = skusDoc.list;
  }
  SKU_MAP = {}; State.skus.forEach(s=>SKU_MAP[s.id]=s);

  const accDoc = await refGet('accounts');
  if(!accDoc || accDoc.version !== REF_DATA_VERSION){
    await refSet('accounts', DEFAULT_ACCOUNTS, REF_DATA_VERSION);
    State.accounts = DEFAULT_ACCOUNTS;
  } else {
    State.accounts = accDoc.list;
  }

  watchVisits();
  State.loaded = true;
}
function saveMe(){ localStorage.setItem('shelfpulse_me', JSON.stringify({role:State.role, name:State.name})); }
async function saveSkus(){ await refSet('skus', State.skus, REF_DATA_VERSION); SKU_MAP={}; State.skus.forEach(s=>SKU_MAP[s.id]=s); }

async function submitVisit(){
  const d = State.draft;
  if(!d.accountName || !d.branch){ showToast('Select an account first'); return; }
  if(d.items.length === 0){ showToast('No SKUs loaded — reselect the account'); return; }
  const incompleteIdx = d.items.findIndex(it => !isItemComplete(it));
  if(incompleteIdx !== -1){
    const skuName = (SKU_MAP[d.items[incompleteIdx].skuId]||{}).name || 'a SKU';
    d.items[incompleteIdx]._open = true;
    showToast(`Enter all fields for "${skuName}" — use 0 if it's not stocked here`);
    render();
    return;
  }
  const visit = {
    id: uid(),
    accountId: d.accountId, accountName: d.accountName, branch: d.branch,
    channel: d.channel || '', region: d.region || '',
    date: d.date, auditor: State.name || 'Unnamed',
    status: 'pending', items: d.items,
    photo: d.photo || null, geo: d.geo || null, capturedAt: d.capturedAt || null,
    submittedAt: Date.now(),
  };
  await visitCreate(visit);
  State.draft = { accountId:'', accountName:'', branch:'', channel:'', region:'', date: todayStr(), items: [], photo:null, geo:null, capturedAt:null };
  State.accountSearch = '';
  showToast('Visit submitted for approval ✓');
  State.tab = 'myvisits';
  render();
}
async function setVisitStatus(id, status, note){
  const patch = { status, reviewedAt: Date.now(), reviewedBy: State.name || 'Supervisor' };
  if(note) patch.reviewNote = note;
  await visitUpdate(id, patch);
}
function showToast(msg){ State.toast = msg; render(); setTimeout(()=>{ State.toast = null; render(); }, 2200); }

/* ============================= PHOTO + GEO CAPTURE ============================= */
function capturePhoto(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.onchange = async () => {
    const file = inp.files[0]; if(!file) return;
    showToast('Processing photo…');
    const dataUrl = await compressImage(file, 640, 0.55);
    State.draft.photo = dataUrl;
    State.draft.capturedAt = Date.now();
    captureGeo();
    render();
  };
  inp.click();
}
function compressImage(file, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    reader.readAsDataURL(file);
  });
}
function captureGeo(){
  if(!navigator.geolocation){ showToast('Location not supported on this device'); render(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { State.draft.geo = { lat: +pos.coords.latitude.toFixed(5), lng: +pos.coords.longitude.toFixed(5), accuracy: Math.round(pos.coords.accuracy) }; render(); },
    err => { State.draft.geo = null; showToast('Location permission denied — visit will be flagged unverified'); render(); },
    { enableHighAccuracy:true, timeout:8000 }
  );
}
function removePhoto(){ State.draft.photo=null; State.draft.geo=null; State.draft.capturedAt=null; render(); }

/* ============================= RENDER HELPERS ============================= */
function fmt(n, d=0){ n = isFinite(n) ? n : 0; return n.toFixed(d); }
function statusChip(status, label){ return `<span class="chip ${status}">${label}</span>`; }
function barColor(pct){ return pct>=90?'var(--green)': pct>=70?'var(--amber)':'var(--red)'; }
function gauge(pct, label, size=64){
  pct = Math.max(0,Math.min(100,pct||0));
  const r = size/2-6, c = 2*Math.PI*r, off = c - (pct/100)*c;
  const color = barColor(pct);
  return `<div class="gauge-wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#EFEBE9" stroke-width="7" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="7" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="50%" y="53%" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${fmt(pct)}%</text>
    </svg>
    <div><div class="gauge-num" style="color:${color}">${fmt(pct)}%</div><div class="gauge-lbl">${label}</div></div>
  </div>`;
}
function emptyState(icon,title,sub){ return `<div class="empty"><div class="big">${icon}</div><p style="font-weight:700;color:var(--ink)">${title}</p><p>${sub}</p></div>`; }

/* Merchandiser visit-target lookup from route plan (best-effort name match) */
function targetForMerch(name){
  if(!name) return 0;
  return State.accounts.filter(a => (a.merch||'').trim() === name.trim()).reduce((s,a)=>s+(a.target||0),0);
}
function achievedForMerch(name){
  return State.visits.filter(v=>v.auditor===name).length;
}
function nameOptions(){
  if(State.role==='merchandiser'){
    return [...new Set(State.accounts.map(a=>a.merch).filter(Boolean))].sort();
  }
  return [...new Set(State.accounts.map(a=>a.sup).filter(Boolean))].sort();
}

function screenHome(){
  const pendingCount = State.visits.filter(v=>v.status==='pending').length;
  const approved = State.visits.filter(v=>v.status==='approved');
  const aggs = approved.map(v=>visitAggregate(v));

  if(State.role === 'merchandiser'){
    const mine = State.visits.filter(v=>v.auditor===(State.name||'Unnamed'));
    const target = targetForMerch(State.name);
    const achieved = mine.length;
    return `<div class="screen">
      <h1>Hi ${State.name || 'there'} 👋</h1>
      <p class="lede">Log today's shelf audit — everything auto-calculates.</p>
      <div class="kpi-grid">
        <div class="kpi accent"><div class="num">${achieved}${target?'/'+target:''}</div><div class="lbl">Visits done${target?' vs target':''}</div></div>

    </div>`;
  }
  const overallScore = aggs.length ? aggs.map(a=>({...a, visitAchievedPct:100})).reduce((s,a)=>s+scoreFor(a),0)/aggs.length : 0;
  return `<div class="screen">
    <h1>Field pulse</h1>
    <p class="lede">Live view across all merchandisers and accounts.</p>
    <div class="card">${gauge(overallScore, 'Overall scorecard', 78)}</div>
    <div class="kpi-grid">
      <div class="kpi accent"><div class="num">${pendingCount}</div><div class="lbl">Pending approval</div></div>
      <div class="kpi"><div class="num">${approved.length}</div><div class="lbl">Approved visits</div></div>
      <div class="kpi"><div class="num">${fmt(aggs.length?aggs.reduce((s,a)=>s+a.avgSfr,0)/aggs.length:0)}%</div><div class="lbl">Avg shelf fill</div></div>
      <div class="kpi"><div class="num">${fmt(aggs.length?aggs.filter(a=>a.hasPhoto&&a.hasGeo).length/aggs.length*100:0)}%</div><div class="lbl">Visits verified</div></div>
    </div>
    ${pendingCount>0 ? `<button class="btn btn-primary" onclick="go('approvals')">Review ${pendingCount} pending visit${pendingCount>1?'s':''}</button>` : ''}
    <div class="sectitle">Latest activity</div>
    ${State.visits.slice(0,5).map(visitRowHtml).join('') || emptyState('📭','No visits yet','Once merchandisers submit audits, they will show up here.')}
  </div>`;
}

    </div>

function dashOverview(approved){
  const aggs = approved.map(v=>visitAggregate(v));
  const avg = f => aggs.reduce((s,a)=>s+f(a),0)/aggs.length;
  return `<div class="kpi-grid">
    <div class="kpi accent"><div class="num">${fmt(avg(a=>a.avgSfr))}%</div><div class="lbl">Avg shelf fill (SFR)</div></div>
    <div class="kpi"><div class="num">${fmt(avg(a=>a.avgSos))}%</div><div class="lbl">Avg share of shelf</div></div>
    <div class="kpi"><div class="num">${fmt(avg(a=>a.osaPct))}%</div><div class="lbl">On-shelf availability</div></div>
    <div class="kpi"><div class="num">${fmt(avg(a=>a.priceOkPct))}%</div><div class="lbl">Price matching RSP</div></div>
    <div class="kpi"><div class="num">${fmt(avg(a=>a.avgCoverage),1)}d</div><div class="lbl">Avg stock coverage</div></div>
    <div class="kpi"><div class="num">${fmt(aggs.filter(a=>a.hasPhoto&&a.hasGeo).length/aggs.length*100)}%</div><div class="lbl">Visits verified</div></div>
  </div>`;
}
function dashByCategoryBranch(approved){
  const byCat = {};
  approved.forEach(v=>{
    const agg = visitAggregate(v);
    agg.items.forEach(it=>{
      const sku = SKU_MAP[it.skuId]; if(!sku) return;
      const cat = sku.category;
      byCat[cat] = byCat[cat] || { branches:{}, sfrSum:0, sosSum:0, n:0 };
      byCat[cat].sfrSum += it.calc.sfr; byCat[cat].sosSum += it.calc.sos; byCat[cat].n++;
      const br = v.branch;
      byCat[cat].branches[br] = byCat[cat].branches[br] || { sfrSum:0, sosSum:0, n:0 };
      byCat[cat].branches[br].sfrSum += it.calc.sfr; byCat[cat].branches[br].sosSum += it.calc.sos; byCat[cat].branches[br].n++;
    });
  });
  const cats = Object.keys(byCat).sort();
  if(cats.length===0) return emptyState('📦','No category data yet','');
  return cats.map(cat=>{
    const c = byCat[cat];
    const open = State.expandedCategory === cat;
    return `<div class="card">
      <div class="branch-toggle" onclick="toggleCategory('${cat.replace(/'/g,"\\'")}')">
        <div><div class="visit-main">${cat}</div><div class="visit-sub">SFR ${fmt(c.sfrSum/c.n)}% · SOS ${fmt(c.sosSum/c.n)}%</div></div>
        <div style="font-size:16px">${open?'−':'+'}</div>
      </div>
      ${open ? Object.entries(c.branches).map(([br,b])=>`
        <div class="visit-row">
          <div class="visit-sub">${br}</div>
          <div class="visit-sub">SFR ${fmt(b.sfrSum/b.n)}% · SOS ${fmt(b.sosSum/b.n)}%</div>
        </div>`).join('') : ''}
    </div>`;
  }).join('');
}
function dashBySku(approved){
  const bySku = {};
  approved.forEach(v=>{
    const agg = visitAggregate(v);
    agg.items.forEach(it=>{
      const sku = SKU_MAP[it.skuId]; if(!sku) return;
      bySku[sku.id] = bySku[sku.id] || { name:sku.name, category:sku.category, sfrSum:0, sosSum:0, velSum:0, priceOk:0, n:0 };
      const b = bySku[sku.id];
      b.sfrSum += it.calc.sfr; b.sosSum += it.calc.sos; b.velSum += it.calc.velocity;
      if(it.calc.priceStatus==='on') b.priceOk++;
      b.n++;
    });
  });
  const rows = Object.values(bySku).sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name));
  if(rows.length===0) return emptyState('📦','No SKU data yet','');
  return `<div class="card"><table class="mini">
    <tr><th>SKU</th><th>Vel/d</th><th>SFR</th><th>SOS</th><th>Price OK</th></tr>
    ${rows.map(r=>`<tr><td>${r.name}<br><span class="hint">${r.category}</span></td><td>${fmt(r.velSum/r.n,1)}</td><td>${fmt(r.sfrSum/r.n)}%</td><td>${fmt(r.sosSum/r.n)}%</td><td>${fmt(r.priceOk/r.n*100)}%</td></tr>`).join('')}
  </table></div>`;
}

    const mine = State.visits.filter(v=>v.auditor===name);

    return { name, achieved: mine.length, target, avgSfr: avg(a=>a.avgSfr), avgSos: avg(a=>a.avgSos), dataCompletion: avg(a=>a.visitDonePct), verifiedPct: mine.length ? verified/mine.length*100 : 0 };

  return `<div class="screen">

    ${rows.map(r=>`
      <div class="card">

        </div>
        <div class="verify-row">

}

/* ---- Scorecard ---- */
function screenScorecard(){
  const approved = State.visits.filter(v=>v.status==='approved');
  const byBranch = {};
  approved.forEach(v=>{ byBranch[v.branch] = byBranch[v.branch] || []; byBranch[v.branch].push(v); });
  const rows = Object.entries(byBranch).map(([branch, visits])=>{
    const aggs = visits.map(visitAggregate);
    const avg = f => aggs.reduce((s,a)=>s+f(a),0)/aggs.length;
    const merchNames = [...new Set(visits.map(v=>v.auditor))];
    const targetSum = merchNames.reduce((s,n)=>s+targetForMerch(n),0);
    const achievedSum = merchNames.reduce((s,n)=>s+achievedForMerch(n),0);
    const a = { avgSfr: avg(x=>x.avgSfr), avgSos: avg(x=>x.avgSos), osaPct: avg(x=>x.osaPct), priceOkPct: avg(x=>x.priceOkPct), visitDonePct: avg(x=>x.visitDonePct), visitAchievedPct: targetSum ? Math.min(100, achievedSum/targetSum*100) : 100 };
    return { branch, visits: visits.length, score: scoreFor(a), ...a };
  }).sort((a,b)=>b.score-a.score);
  if(rows.length===0) return `<div class="screen"><h1>Scorecard</h1><p class="lede">Weighted score by branch.</p>${emptyState('🏆','No approved visits yet','')}</div>`;
  return `<div class="screen">
    <h1>Scorecard</h1>
    <p class="lede">SFR 25% · OSA 15% · Price 20% · SOS 15% · Visit compliance 15% · Data completion 10%.</p>
    ${rows.map(r=>`
      <div class="card">
        <div class="visit-row" style="border:none;padding:0 0 8px">
          <div class="visit-main">${r.branch}</div>
          <div style="font-size:20px;font-weight:800;color:${barColor(r.score)}">${fmt(r.score)}%</div>
        </div>
        <div class="hint" style="margin-bottom:8px">${r.visits} visit${r.visits>1?'s':''} rolled up</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,r.score)}%;background:${barColor(r.score)}"></div></div>
      </div>`).join('')}
  </div>`;
}

/* ============================= EVENT HANDLERS ============================= */
function go(tab){ State.tab = tab; render(); window.scrollTo(0,0); }
function setRole(r){ State.role = r; State.tab='home'; if(!nameOptions().includes(State.name)) State.name=''; saveMe(); render(); }
function setName(v){ State.name = v; saveMe(); }
function d(field,val){ State.draft[field]=val; }
function setDashSub(s){ State.dashSub = s; render(); }
function toggleCategory(cat){ State.expandedCategory = State.expandedCategory===cat ? null : cat; render(); }
function onAccountSearch(v){ State.accountSearch = v; render(); }
function pickAccount(id){
  const a = State.accounts.find(a=>a.id===id); if(!a) return;
  const dft = State.draft;
  dft.accountId = a.id; dft.accountName = a.name; dft.branch = a.branch; dft.channel = a.channel; dft.region = a.region;
  if(dft.items.length === 0){
    dft.items = State.skus.map(s => ({skuId:s.id, opening:'', closing:'', deliveries:'', pogFacings:'', actualCapacity:'', catFacings:'', shahdFacings:'', actualPrice:'', days:'7', _open:false}));
  }
  render();
}
function clearAccount(){ State.draft.accountId=''; State.draft.accountName=''; State.draft.branch=''; State.draft.items=[]; State.accountSearch=''; render(); }
function toggleLine(idx){ State.draft.items[idx]._open = !State.draft.items[idx]._open; render(); }
function lineField(idx,field,val){ State.draft.items[idx][field]=val; renderPartial(); }
function rejectPrompt(id){ const note = prompt('Reason for rejection (optional):') || ''; setVisitStatus(id,'rejected',note); }
function openVisit(id){
  const v = State.visits.find(v=>v.id===id); if(!v) return;
  const agg = visitAggregate(v);
  alert(`${v.accountName} · ${v.branch}\n${v.date} · ${v.auditor}\nStatus: ${v.status}\n\nAvg SFR ${fmt(agg.avgSfr)}% · Avg SOS ${fmt(agg.avgSos)}%\nOSA ${fmt(agg.osaPct)}% · Price OK ${fmt(agg.priceOkPct)}%\nData complete ${fmt(agg.visitDonePct)}%` + (v.reviewNote ? `\nNote: ${v.reviewNote}` : ''));
}
function skuField(idx,field,val){ State.skus[idx][field] = val; saveSkus(); }
function addSku(){ State.skus.push({id:'sku_'+uid(), name:'New SKU', category:'', rsp:0}); saveSkus(); render(); }
function removeSku(idx){ State.skus.splice(idx,1); saveSkus(); render(); }

let renderTimer=null;
function renderPartial(){ if(renderTimer) clearTimeout(renderTimer); renderTimer=setTimeout(render, 250); }

/* ============================= NAV ============================= */
function navHtml(){
  const merchTabs = [
    {id:'home', ico:'🏠', lbl:'Home'},
    {id:'newvisit', ico:'➕', lbl:'New visit'},
    {id:'myvisits', ico:'📋', lbl:'My visits'},
  ];
  const supTabs = [
    {id:'home', ico:'🏠', lbl:'Home'},
    {id:'approvals', ico:'✅', lbl:'Approvals', badge: State.visits.filter(v=>v.status==='pending').length},
    {id:'dashboard', ico:'📊', lbl:'Dashboard'},
    {id:'team', ico:'👥', lbl:'Team'},
    {id:'scorecard', ico:'🏆', lbl:'Scorecard'},
  ];
  const tabs = State.role==='merchandiser' ? merchTabs : supTabs;
  return `<div class="navbar">${tabs.map(t=>`
    <div class="navbtn-wrap">
      <button class="navbtn ${State.tab===t.id?'active':''}" onclick="go('${t.id}')">
        <span class="ico">${t.ico}</span><span class="lbl">${t.lbl}</span>
      </button>
      ${t.badge ? `<span class="badge-dot">${t.badge}</span>` : ''}
    </div>`).join('')}</div>`;
}

/* ============================= MAIN RENDER ============================= */
function render(){
  const app = document.getElementById('app');
  if(!State.loaded){ app.innerHTML = `<div class="loading">Loading Shelf Pulse…</div>`; return; }
  let body = '';
  if(State.role==='merchandiser'){
    if(State.tab==='newvisit') body = screenNewVisit();
    else if(State.tab==='myvisits') body = screenMyVisits();
    else body = screenHome();
  } else {
    if(State.tab==='approvals') body = screenApprovals();
    else if(State.tab==='dashboard') body = screenDashboard();
    else if(State.tab==='team') body = screenTeam();
    else if(State.tab==='scorecard') body = screenScorecard();
    else if(State.tab==='skus') body = screenSkus();
    else body = screenHome();
  }
  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <div class="brand-mark">C3A</div>
          <div><div class="brand-name">Shelf Pulse</div><div class="brand-sub">Live merchandising tracker</div></div>
        </div>
        <div class="role-pill">
          <button class="${State.role==='merchandiser'?'active':''}" onclick="setRole('merchandiser')">Field</button>
          <button class="${State.role==='supervisor'?'active':''}" onclick="setRole('supervisor')">Supervisor</button>
        </div>
      </div>
      <div class="who-row">
        <select class="who-input" onchange="setName(this.value)" style="appearance:none;-webkit-appearance:none;">
          <option value="" ${!State.name?'selected':''} style="color:#000">Select your name…</option>
          ${nameOptions().map(n=>`<option value="${n}" ${State.name===n?'selected':''} style="color:#000">${n}</option>`).join('')}
        </select>
      </div>
      ${State.role==='supervisor' ? `<div style="margin-top:8px;position:relative;z-index:1"><button class="btn-sm" style="background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer" onclick="go('skus')">⚙ Manage SKUs</button></div>` : ''}
    </div>
    ${body}
    ${navHtml()}
    ${State.toast ? `<div class="toast">${State.toast}</div>` : ''}
  `;
}

/* ============================= EXPOSE HANDLERS ============================= */
Object.assign(window, {
  go, setRole, setName, d, setDashSub, toggleCategory, onAccountSearch, pickAccount, clearAccount,
  toggleLine, lineField, rejectPrompt, openVisit, skuField, addSku, removeSku,
  submitVisit, setVisitStatus, capturePhoto, removePhoto
});

/* ============================= INIT ============================= */
(async function init(){
  if(isConfigured){ render(); await loadAll(); render(); }
})();
</script>
</body>
</html>
